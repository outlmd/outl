# cargo-deny config. CI runs `cargo deny check advisories` (RustSec gate).
# Dependabot misses most RustSec advisories for this workspace, so this is the
# check that catches them. Vulnerabilities always fail; every ignore below is an
# unmaintained or unsound advisory (no known vulnerability) pulled in
# transitively, each with a reason.
# Drop an entry as soon as the upstream crate moves off it.

[graph]
all-features = true

[advisories]
# Defaults are "workspace" in cargo-deny 0.20; check the whole graph.
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, transitive (no fix upstream yet)" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, transitive build-time macro" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr unmaintained, transitive" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, via serde_yaml_ng" },
    { id = "RUSTSEC-2025-0075", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0080", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0081", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0083", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0094", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0098", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0100", reason = "unic-* unmaintained, transitive" },
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 unmaintained, via steel-core (outl-exec)" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps unmaintained, via im-rc (steel-core)" },
    { id = "RUSTSEC-2026-0250", reason = "im-rc unmaintained, via steel-core (outl-exec)" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks unmaintained, via im-rc (steel-core)" },
    # zbus 6.0.0 folded zvariant / zvariant_derive / zbus_names into itself and the
    # standalone crates were marked unmaintained. We reach them through zbus 5 (Tauri's
    # notification, opener and single-instance plugins, notify-rust, all pinned to
    # `zbus ^5`) and zbus 4 (keyring 3 -> secret-service 4). Linux desktop only.
    # Drop these once Tauri's plugins move to zbus 6 and keyring moves off zbus 4.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained (merged into zbus 6), via zbus 4/5 in keyring and Tauri plugins; no zbus 6 path upstream yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained (merged into zbus 6), via zbus 4/5 in keyring and Tauri plugins; no zbus 6 path upstream yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained (merged into zbus 6), via zbus 4/5 in keyring and Tauri plugins; no zbus 6 path upstream yet" },
    # Unsound (not vulnerabilities), no fixed release reachable yet:
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 VariantStrIter unsound, via Tauri's gtk3 chain on Linux desktop; no glib 0.20+ release reachable while Tauri is on gtk3 (Dependabot alert #33)" },
    { id = "RUSTSEC-2026-0255", reason = "sized-chunks unsound on panic, via im-rc in steel-core; only in the non-default lang-lisp feature" },
    # The zstd family, published 2026-10-26. Thirteen entries, and the reason is
    # one claim, so check the claim rather than the count.
    #
    # `cargo tree -i` gives these exactly one parent: `wasmtime-internal-cache`,
    # wasmtime's on-disk cache of compiled modules, which compresses what it
    # stores. **outl never turns that cache on.** `wasm::engine::make_engine`
    # builds a `Config::new()` and sets fuel, epoch interruption, opt level,
    # multi-memory and bulk-memory; caching is opt-in in wasmtime
    # (`Config::cache*`) and nothing here calls it, so no code path in any outl
    # binary reaches zstd. That is the whole argument, and it is one grep away
    # from being re-checked: a cache setter appearing in `engine.rs` invalidates
    # every line below.
    #
    # Note what the argument is NOT. It is not "this is behind an opt-in
    # feature": `lang-rust = ["wasm"]` is in `outl-exec`'s default set, and the
    # CLI, the TUI and the desktop all take default features, so this code is
    # linked into shipped binaries. What is absent is the call, not the crate.
    #
    # Clearing them needs zstd >= 0.14.3 and zstd-safe >= 8.2.0, and wasmtime
    # picks those versions, not us. Re-check on every wasmtime bump; drop the
    # lines that stop firing.
    #
    # `zstd-sys` is deliberately not on this list. Its RUSTSEC-2026-0410 was
    # patched in 2.1.2, which is semver-reachable, so the lockfile was bumped
    # instead of ignored. An entry here means "no reachable fix", never "we did
    # not look".
    { id = "RUSTSEC-2026-0391", reason = "zstd data leak between streams on a reused context, via wasmtime-internal-cache; needs zstd 0.14.3, which wasmtime pins away" },
    { id = "RUSTSEC-2026-0395", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0396", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0397", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0399", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0400", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0401", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0402", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe Seekable::decompress sets a Vec length past capacity, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0404", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0405", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
    { id = "RUSTSEC-2026-0406", reason = "zstd-safe unsound, via wasmtime-internal-cache; needs 8.2.0, wasmtime is on ^7" },
]
