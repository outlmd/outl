name: Discussions to Discord

# Mirrors GitHub Discussions into a Discord forum channel through a webhook.
# One way only: nothing is ever written back to GitHub, so the job holds read
# permissions and nothing else. Replies happen on GitHub; the Discord post
# links there.
#
# Why artifacts hold the state. A Discord webhook can create a forum post and
# post into one, but it cannot list or search threads, so the discussion
# number -> thread id map has to live somewhere. Each discussion gets its own
# artifact, `discord-thread-<number>`, holding {"discussion": N, "thread_id": "..."}.
# Rejected:
#   - a hidden GitHub comment, or a state branch/file: both write to GitHub
#     and need write permissions this job should never have.
#   - a repo variable: GITHUB_TOKEN cannot write variables, it would need an
#     extra PAT secret.
#   - actions/cache: entries are evicted after 7 days without access, and one
#     shared map races between concurrent runs.
# Artifacts are immutable, need only `actions: read` to look up, and cannot
# race across discussions. The `#<number>` prefix in the thread name keeps a
# post findable by hand.
#
# Provenance. Any workflow run in this repo can upload an artifact with any
# name, and a run started from a fork PR could upload a forged
# `discord-thread-<number>` that points a discussion at the wrong thread. The
# tool therefore only believes an artifact that is not expired, whose run
# belongs to this repository (head and base repository id both equal
# GITHUB_REPOSITORY_ID), ran on the default branch, is a run of this very
# workflow file, and was started by one of this workflow's own events. The
# newest artifact that passes wins; the others are skipped with a notice.
# `actions: read` is all of that needs.
#
# The logic is the Rust crate in tools/discussions-discord, built here with the
# pinned toolchain and the locked dependencies. Its tests run in ci.yml with
# the rest of the workspace.
#
# Limitation: the artifact is re-uploaded on every event with 90 days of
# retention, so the clock restarts with each comment. A discussion silent for
# more than 90 days loses its mapping and the next comment opens a new Discord
# post with the same `#<number>` prefix.
#
# `edited` is deliberately not handled: it fires on every typo fix and would
# only add noise to the forum.
on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      discussion:
        description: Discussion number to (re)post when it has no Discord thread yet
        required: true
        type: number

permissions:
  contents: read
  # Looks up the artifact an earlier run uploaded.
  actions: read
  # Only workflow_dispatch reads the discussion through GraphQL; the other
  # events carry it in the payload.
  discussions: read

# One run at a time per discussion, so a comment that lands right after the
# discussion is created waits for the post instead of opening a second thread.
# GitHub keeps only one pending run per group and cancels older pending ones,
# so a burst of three comments while one run is in flight can drop the middle
# one on the Discord side. GitHub still has all of them.
concurrency:
  group: discussions-discord-${{ github.event.discussion.number || inputs.discussion }}
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror
    # Forks have no webhook secret and no business posting to our forum.
    if: github.repository == 'outlmd/outl'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # A cold compile of the crate and its HTTP stack; a warm cache is ~1 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup show

      # Its own cache key, so a build of this one package neither evicts nor
      # is evicted by the CI caches. Only the default branch saves it.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: discussions-discord
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      # Built before the secret is in the environment: no build script or
      # dependency ever sees it.
      - name: build
        run: cargo build --locked -p discussions-discord

      # The tool reads the event from GITHUB_EVENT_PATH itself. Titles and
      # bodies are attacker-controlled text, so none of it is interpolated
      # into this `run:` line.
      - name: mirror to Discord
        id: sync
        env:
          DISCORD_DISCUSSIONS_WEBHOOK: ${{ secrets.DISCORD_DISCUSSIONS_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set by Actions already; spelled out because the provenance check
          # fails closed without it.
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
        run: ./target/debug/discussions-discord

      # `always()` so a thread that was created before a later step failed
      # still gets its mapping stored, instead of being duplicated next time.
      - name: store the thread id
        if: always() && steps.sync.outputs.save == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.sync.outputs.artifact_name }}
          path: ${{ steps.sync.outputs.thread_file }}
          retention-days: 90
          if-no-files-found: error
