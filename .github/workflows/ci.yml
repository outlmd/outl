name: CI

# Trigger filter: `paths-ignore` skips CI when every changed file is
# in the list. Docs-only PRs, asset bumps, and edits to sibling
# workflow files don't need fmt + clippy + test + doc to run.
# `Cargo.toml` / `Cargo.lock` stay out of the ignore list on purpose
# so dependency changes always trigger the full check.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/bench.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/testflight.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'assets/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/workflows/mobile.yml'
      - '.github/workflows/bench.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/testflight.yml'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel the previous CI run when a newer commit lands on the same
# ref. Status reported on `main` (and on a PR) is the one that matters
# for the latest tip; the older fmt/clippy/test run for the parent
# commit just burns runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runner sizing across this file is measured, not guessed: see the
  # numbers recorded in `docs/development.md` → "Runner sizing".
  # `cargo fmt` never compiles anything (16s wall clock, no cargo
  # build), so the smallest SKU is the right one.
  fmt:
    name: rustfmt
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (rustfmt)
        run: rustup show
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # 8 vCPU: clippy is a pure compile job and the 4 vCPU run sat at 71%
  # average CPU with only 2.6 GB of 16 GB used — CPU-bound, memory to
  # spare. Blacksmith bills per vCPU-minute, so doubling cores is
  # roughly billing-neutral as long as rustc keeps scaling, and it
  # halves the wall clock a human waits on.
  clippy:
    name: clippy
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (clippy)
        run: rustup show
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0.8-rust"
      - name: cargo clippy
        # outl-mobile, outl-desktop and outl-tauri-shared pull Tauri
        # deps (glib-sys, gobject-sys, webkit2gtk) that need system
        # GTK libs we don't install here. Mobile is covered by
        # `mobile.yml` on macOS; desktop + the shared crate build via
        # the `desktop.yml` matrix (Linux runs with GTK installed
        # there).
        run: cargo clippy --workspace --exclude outl-mobile --exclude outl-desktop --exclude outl-tauri-shared --all-targets -- -D warnings

  # The check name is `matrix.label`, never `matrix.os`, on purpose.
  # Branch protection matches required checks by *name*, so having the
  # runner SKU in the name means every runner change (this migration
  # included) silently renames the required check and leaves `main`
  # waiting forever on a check that no longer reports. `linux` /
  # `macos` are stable across any future SKU move.
  test:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 8 vCPU: measured 76% average CPU and 4.7 GB of 16 GB on
          # 4 vCPU — the same CPU-bound / memory-idle shape as clippy.
          - os: blacksmith-8vcpu-ubuntu-2404
            label: linux
          # 6 vCPU is the smallest macOS SKU Blacksmith offers.
          - os: blacksmith-6vcpu-macos-15
            label: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0.8-rust"
      - name: cargo test
        # outl-mobile, outl-desktop and outl-tauri-shared depend on
        # Tauri's macOS/iOS-specific surface and on system GTK libs we
        # don't install on Linux. Mobile is covered by `mobile.yml` on
        # macOS; desktop + the shared crate via the `desktop.yml`
        # matrix.
        run: cargo test --workspace --exclude outl-mobile --exclude outl-desktop --exclude outl-tauri-shared --all-targets

  docs:
    name: cargo doc
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      # `cargo doc --workspace` compiles every dependency exactly like
      # clippy and test do; this job was the only Rust job in the file
      # running without the cache, paying a cold build every run.
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0.8-rust"
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        # See clippy / test jobs above: outl-mobile, outl-desktop and
        # outl-tauri-shared need system GTK libs we don't install on
        # Linux. Mobile docs build via `mobile.yml` on macOS; desktop +
        # shared-crate docs via the `desktop.yml` matrix.
        run: cargo doc --workspace --exclude outl-mobile --exclude outl-desktop --exclude outl-tauri-shared --no-deps

  # Dedicated sync-convergence gate. The `test` job above already
  # compiles and runs `outl-core` + `outl-sync-iroh` (including their
  # `tests/` integration + property suites via `--all-targets`), but it
  # runs proptests at the dev default (200 cases) and buries a sync
  # regression inside a broad matrix job. This job exists so a sync
  # regression surfaces as its own obviously-red check, and so the
  # convergence/chaos proptests actually *explore* in CI.
  #
  # `PROPTEST_CASES` is proptest's built-in override of each suite's
  # `ProptestConfig::with_cases(...)`. Dev runs stay fast at the 200
  # baked into the test files; CI bumps it to 1024 here so the
  # probabilistic convergence bugs (op reordering, cycle no-ops,
  # concurrent moves) get a real number of generated cases. Keep this
  # budget on this one job only — running 1024 across the whole
  # `test` matrix would burn runner minutes for no extra signal.
  #
  # Branch protection: mark **`sync`** as a required status check in
  # the repo settings so a red convergence run blocks merge. (Required
  # checks are a GitHub repo setting, not something this file can
  # declare.)
  sync:
    name: sync
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      # Higher than the dev default baked into the proptest files so CI
      # explores the convergence/chaos space. Bump further (2048+) when
      # chasing a rare flake; lower only with a recorded reason.
      PROPTEST_CASES: 1024
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v0.8-rust"
      - name: cargo test (sync convergence)
        run: cargo test -p outl-core -p outl-sync-iroh --all-targets

  # Frontend gate for the whole bun workspace, in `ci.yml` rather than
  # in the per-client workflows on purpose.
  #
  # `desktop.yml` runs `bun --filter outl-desktop test` and `mobile.yml`
  # runs vitest with `working-directory: crates/outl-mobile`, so each
  # covers only its own package. That left `@outl/shared` — 22 test
  # files, 335 assertions, the library both clients import — with no
  # gate anywhere, and it left every client suite behind a `paths:`
  # filter that does not list the crates it actually depends on
  # (`outl-frontend-shared`, `outl-shortcuts`, `outl-theme`). A change
  # to the shared library or to a Rust catalog the TS side mirrors could
  # go green without a single frontend test running.
  #
  # `ci.yml` has no `paths:` allowlist (only `paths-ignore` for docs and
  # assets), so this job runs on effectively every code change — which
  # is the property the parity tests need. `shortcuts.support.test.ts`
  # pins the desktop handler map against `outl_shortcuts::support`
  # (invariant 12) and the theme suites pin the token names against
  # `outl_theme::Palette` (invariant 13); both are worthless if they
  # only run when someone happens to touch the client directory.
  #
  # Cheapest runner on purpose: vitest across all three packages is
  # ~4s wall clock and never saturated 2 vCPU. No GTK / Tauri system
  # deps here — these are happy-dom unit suites, not app builds.
  frontend:
    name: frontend
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # `setup-bun` caches the bun binary, not the packages it installs.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: bun install
        run: bun install --frozen-lockfile
      # Root scripts fan out over every workspace package that declares
      # the script (`bun --filter '*'`), so a new client is covered the
      # day its package.json lands — no edit here required.
      - name: vitest (all packages)
        run: bun run test
      # tsc was desktop-only before this job existed: `@outl/shared` and
      # `outl-mobile` type-checked nowhere despite shipping in both apps.
      - name: tsc --noEmit (all packages)
        run: bun run typecheck

  # Repo hygiene checks that used to exist only as Claude Code
  # `PostToolUse` hooks — and therefore only ran when Claude was the one
  # editing. A human in an editor, a Copilot PR and a dependabot bump all
  # bypassed them entirely, which is how the four largest files in the
  # repo became frontend files the Rust-only hook never looked at.
  #
  # Only the objectively-checkable guard is ported here. The prose ones
  # (semantic line breaks, doc-sync, section refs) stay advisory: they
  # need judgement about intent, and a CI job that is wrong 10% of the
  # time gets ignored 100% of the time.
  hygiene:
    name: hygiene
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # Ratchet, not a cliff: the 66 files already past the threshold are
      # frozen in `.github/file-size-baseline.txt`. This fails only when a
      # new file crosses it or a recorded one grows, so existing large
      # files stay editable while the ceiling can only come down.
      - name: file size ratchet
        run: ./scripts/check-file-size.sh

      # The docs index was silently wrong five times in a row: five RFCs
      # landed, none was listed, and nothing failed. A step everyone
      # forgets needs to fail, not a reminder.
      - name: docs index
        run: ./scripts/check-docs-index.sh
