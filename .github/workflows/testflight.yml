name: TestFlight

# Uploads the signed iOS build to TestFlight. The heavy lifting
# (Rust + Tauri archive + xcodebuild export) lives in
# `mobile.yml`'s `ios-release` job, which publishes the signed
# `.ipa` as the `outl-ios-release` artifact. This workflow only
# downloads that artifact and runs `xcrun altool --upload-app`,
# so a TestFlight ship takes ~3 min instead of ~20.
#
# Triggers:
#   - `workflow_run` on the `Mobile` workflow completing successfully.
#     Mobile already filters by path, so a docs-only push to main
#     never touches TestFlight.
#   - `workflow_dispatch` lets a human ship from any past `Mobile`
#     run by passing its `mobile_run_id` (defaults to the latest
#     successful run for the current ref).
#
# ------------------------------------------------------------------
# Secrets the workflow expects (Settings → Environments → `release`):
#
#   APP_STORE_CONNECT_KEY_ID         e.g. `ABCD1234EF`
#   APP_STORE_CONNECT_ISSUER_ID      e.g. `69a6de7c-...`
#   APP_STORE_CONNECT_API_KEY_BASE64 base64 of the `.p8` AuthKey
#
# Signing material (cert + provisioning profile) is consumed in
# `mobile.yml`'s `ios-release` job; it never lands here.
# ------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["Mobile"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mobile_run_id:
        description: "Mobile workflow run ID with the IPA artifact (empty = latest successful)"
        required: false
        type: string

permissions:
  contents: read
  actions: read   # download-artifact reaches into another workflow run

jobs:
  # Decides whether there is an IPA to ship, on a cheap Linux runner,
  # before the macOS job and the `release` environment are involved.
  # Mobile runs `ios-release` only on the nightly cron (when its own
  # `gate` proceeds) or on a dispatch with `release_build=true`, yet it
  # reports `success` either way, so a successful `workflow_run` does
  # not imply the artifact exists. Without this check the upload job
  # failed at download-artifact.
  gate:
    name: Check for IPA artifact
    runs-on: ubuntu-latest
    # workflow_run fires on every conclusion; only proceed when:
    #   1. a human triggered us manually (workflow_dispatch), or
    #   2. the Mobile workflow finished `success` AND was triggered
    #      by an event that can run the `ios-release` job —
    #      `schedule` or `workflow_dispatch`. Mobile's `push` and
    #      `pull_request` runs never sign an IPA; `push` is still
    #      listed, and harmless, because the artifact check below skips
    #      a run with no IPA on a free hosted runner. Keep this list in
    #      step with `ios-release`'s `if:` in `mobile.yml`: leaving
    #      `schedule` out meant a nightly IPA never shipped.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    outputs:
      ship: ${{ steps.check.outputs.ship }}
    steps:
      - name: Look for a current outl-ios-release artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MOBILE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A manual dispatch always proceeds: a human who asks to ship
          # should get a clear failure if the chosen run has no IPA.
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FOUND=$(gh api --paginate \
            "repos/$REPO/actions/runs/$MOBILE_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "outl-ios-release" and .expired == false) | .id')
          if [[ -n "$FOUND" ]]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Mobile run $MOBILE_RUN_ID has outl-ios-release"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Mobile run $MOBILE_RUN_ID has no current outl-ios-release artifact (no release build); skipping upload"
          fi

  upload:
    name: Upload IPA to TestFlight
    needs: gate
    # GitHub's hosted macOS, free on a public repo. The job compiles
    # nothing (download, altool upload, an API call: ~3 min, mostly
    # network), so Blacksmith's cores bought nothing at the macOS rate.
    runs-on: macos-15
    if: needs.gate.outputs.ship == 'true'
    # On the job, not the workflow. Every completed Mobile run (PRs
    # included) starts a run of this workflow, and for `workflow_run`
    # `github.ref` is always main, so a workflow-level group let any PR
    # cancel a nightly upload in flight before its own `gate` skipped.
    # Here only a run that is itself going to upload supersedes one: the
    # newest IPA wins, so testers never see an older build land last.
    # The half-upload that leaves is harmless: the build number scales
    # with the beta tag, and ASC rejects a re-upload of the same version.
    concurrency:
      group: testflight-upload
      cancel-in-progress: true
    # The event / conclusion gate and the artifact check live in `gate`.
    environment:
      name: release
      url: https://appstoreconnect.apple.com/apps

    # The App Store Connect IDs are set on each step that reads them
    # rather than on the job, so no other step inherits them.
    steps:
      # Needed for `.github/scripts/testflight_set_whatsnew.py`
      # invoked later. The script is small and the checkout is cheap
      # (a few MB), so we always do it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Mobile run ID
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_RUN_ID: ${{ github.event.inputs.mobile_run_id }}
        run: |
          # Three sources of truth, in priority order:
          #   1. `workflow_dispatch` input (manual override).
          #   2. `workflow_run.id` (the Mobile run that triggered us).
          #   3. latest successful Mobile run on the default branch
          #      (only used when neither of the above is set — keeps
          #      `gh workflow run testflight.yml` from any ref usable).
          if [[ -n "${DISPATCH_RUN_ID:-}" ]]; then
            RUN_ID="$DISPATCH_RUN_ID"
            echo "::notice::Using mobile_run_id from dispatch input: $RUN_ID"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            echo "::notice::Using triggering Mobile run: $RUN_ID"
          else
            RUN_ID=$(gh run list \
              --workflow=Mobile \
              --branch=main \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId')
            if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
              echo "::error::no successful Mobile run on main to ship from"
              exit 1
            fi
            echo "::notice::Falling back to latest successful Mobile run on main: $RUN_ID"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download IPA artifact from Mobile run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: outl-ios-release
          path: ipa-bundle
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.src.outputs.run_id }}

      - name: Read build metadata
        id: meta
        shell: bash
        run: |
          META="ipa-bundle/metadata.env"
          if [[ ! -f "$META" ]]; then
            echo "::error::metadata.env not found in artifact"
            ls -la ipa-bundle/
            exit 1
          fi
          # shellcheck disable=SC1090
          . "$META"
          echo "short_version=${short_version}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "::notice::TestFlight ${short_version} (build ${build_number}) from sha ${head_sha:0:7}"

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          IPA="ipa-bundle/outl.ipa"
          if [[ ! -f "$IPA" ]]; then
            FOUND=$(find ipa-bundle -maxdepth 2 -name '*.ipa' | head -1)
            if [[ -n "$FOUND" ]]; then
              IPA="$FOUND"
            else
              echo "::error::no .ipa in artifact"
              find ipa-bundle -maxdepth 3 -type f
              exit 1
            fi
          fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA"

      # The export compliance pair, checked here because altool answers
      # it at the END of a 70MB upload — and answers `exit 0` while it
      # does (the guard on the upload step is what catches that).
      #
      # `ITSAppUsesNonExemptEncryption = true` is a claim that Apple has
      # APPROVED encryption documentation for this app, and the approval
      # code belongs in `ITSEncryptionExportComplianceCode`. We shipped
      # the flag without the code, so every upload was refused with
      # `Invalid Export Compliance Code ... key value []`, where the
      # empty value is the missing code.
      #
      # So the only incoherent state is true-without-a-code. `false` and
      # an absent key are both fine: absent means App Store Connect asks
      # the questions per build, which is where outl sits today.
      - name: Check export compliance keys
        shell: bash
        env:
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          unzip -q -o "$IPA_PATH" 'Payload/*.app/Info.plist' -d "$WORK"
          PLIST=$(find "$WORK/Payload" -maxdepth 2 -name Info.plist | head -1)
          if [[ -z "$PLIST" ]]; then
            echo "::error::no app Info.plist inside $IPA_PATH"
            exit 1
          fi
          read_key() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null || true
          }
          NON_EXEMPT=$(read_key ITSAppUsesNonExemptEncryption)
          CODE=$(read_key ITSEncryptionExportComplianceCode)
          echo "ITSAppUsesNonExemptEncryption=${NON_EXEMPT:-<absent>}"
          echo "ITSEncryptionExportComplianceCode=${CODE:+<set>}${CODE:-<absent>}"
          if [[ "$NON_EXEMPT" == "true" && -z "$CODE" ]]; then
            echo "::error::ITSAppUsesNonExemptEncryption is true but ITSEncryptionExportComplianceCode is missing. That pair is what App Store Connect refuses as 'Invalid Export Compliance Code'. Either add the approved code from App Store Connect, or drop the flag (and answer the export questions per build). Both halves live in crates/outl-mobile/src-tauri/gen/apple/project.yml and outl-mobile_iOS/Info.plist."
            exit 1
          fi

      # `altool --upload-app` is the documented App Store Connect
      # ingestion path. It ships inside Xcode so we need an Xcode
      # install on the runner (any version works for upload; this
      # step doesn't compile anything).
      - name: Select Xcode (for altool)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode \
            -o "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          # `env.HOME` is empty in an expression: the env context only holds
          # vars set in the workflow, not the runner's HOME. Export the real
          # path so the whatsNew step reads the key from where it was written.
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # `xcrun altool --type ios` is known to return exit 0 even on
          # App Store Connect 4xx (e.g. duplicate CFBundleVersion). Capture
          # output and fail explicitly when altool logs an ERROR line so a
          # broken upload doesn't masquerade as a green job.
          set -o pipefail
          LOG=$(mktemp)
          xcrun altool --upload-app \
            --type ios \
            --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [[ $rc -ne 0 ]]; then
            echo "::error::altool exited with code $rc"
            exit "$rc"
          fi
          if grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9:.]+ ERROR:' "$LOG"; then
            echo "::error::altool reported ERROR despite exit 0 — see log above"
            exit 1
          fi

      # Attach the release notes produced by mobile.yml (via
      # semantic-release) as the TestFlight build's "What to Test"
      # text. The build needs to materialize in App Store Connect
      # first — the script polls up to 5min and best-effort skips
      # on timeout (the upload already succeeded).
      - name: Install Python deps (App Store Connect API)
        run: pip3 install --quiet --break-system-packages pyjwt cryptography requests

      - name: Set TestFlight release notes (whatsNew)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUNDLE_ID: app.outl.mobile-app
          SHORT_VERSION: ${{ steps.meta.outputs.short_version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build_number }}
          NOTES_PATH: ipa-bundle/release-notes.md
          LOCALE: en-US
        run: python3 .github/scripts/testflight_set_whatsnew.py

      # No re-upload of the IPA here: it would duplicate `outl-ios-release`,
      # which the Mobile run already keeps for 30 days, and nothing reads it.

      - name: Cleanup API key
        if: always()
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [[ -n "$APP_STORE_CONNECT_KEY_ID" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          fi
