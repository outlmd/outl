name: Release

# Every push to `main` produces a beta release automatically.
#
# - Tag:     `v<workspace.version>-beta.<run_number>` (e.g. `v0.1.0-beta.42`).
# - Binary:  reports the full beta version (workflow patches Cargo.toml
#            in-place with `sed` before `cargo build`; the change never
#            lands in the repo).
# - GitHub:  published as a prerelease with auto-generated release notes
#            (commits since the previous tag).
#
# When `workspace.package.version` bumps in `Cargo.toml` (e.g. `0.1.0` →
# `0.2.0`), the beta series resets automatically — the workflow just
# re-reads the base each run.
#
# Manual GA release: bump `workspace.package.version`, merge, then push a
# `v0.1.0` tag by hand. The `tags: ["v*"]` trigger below handles it.
#
# Publish layout: a single `create_release` job creates the release as a
# DRAFT before the build matrix runs. Each matrix job uploads its own
# assets via `gh release upload`. A final `publish_release` job flips
# the draft to published. This avoids two known failure modes:
#
#   1. `softprops/action-gh-release` in parallel jobs races to create
#      the release; the loser tries to UPDATE and fails because the
#      repo has Immutable Releases turned on
#      (`target_commitish cannot be changed when release is immutable`).
#   2. Once a release is published + immutable, assets cannot be added.
#      Draft releases accept uploads freely; we only publish after every
#      artifact job *finished*, which is not the same as every artifact
#      landing. `build_android` is best-effort, so the draft flips with or
#      without the APK — and because the release is immutable by then,
#      re-running that job can never attach it. The only recovery is a new
#      beta; `build_android`'s upload step says so rather than letting
#      `gh` answer with a bare 422. What the asset gate added is that the
#      flip now *says* what is missing, in the release body, instead of
#      leaving a user to notice an absent file.
#   3. A job whose `if` omits `always()` / `!cancelled()` still carries the
#      implicit "every ancestor succeeded", and that reads the whole
#      ancestor tree, not the direct `needs`. On a GA run the `tag` job is
#      skipped by design (the tag is already on origin), `create_release`
#      survives on its own `always()`, and every build job under it was
#      skipped anyway — through a `create_release` that had succeeded.
#      v0.12.0 produced a draft release with zero assets that way, while
#      the beta.227 run twenty seconds earlier built all 26. So the build
#      jobs carry `!cancelled()` too, the same guard `publish_release` and
#      `update_tap` already needed for the same reason. That shape is also
#      what the gate in `publish_release` now catches on its own: a draft
#      with zero assets fails it, rather than publishing.
#
# What a release must carry, and what it may be missing, is
# `scripts/release_assets.py` — one entry per build-matrix leg. It is read
# by `publish_release` (gate the publish), by `update_tap` (move a package
# manager only when every asset it points at landed) and offline by
# `hygiene.yml` (the matrices, the bump loops and the four manifests all
# name the same platforms). Adding a platform starts there.
#
# ------------------------------------------------------------------
# Crash-reporting secrets (RFC 0377).
#
#   OUTL_SENTRY_DSN_CLI       repository secret. DSN of the `outl-cli`
#                             Sentry project
#   OUTL_SENTRY_DSN_DESKTOP   repository secret. DSN baked into the desktop
#                             binary. Events land in the `outl` project
#                             (issue ids OUTL-*) with release
#                             `desktop@<version>`. Symbol upload uses that
#                             project, not a separate `outl-desktop`.
#   OUTL_SENTRY_DSN_MOBILE    repository secret. DSN of the `outl-mobile`
#                             Sentry project (also read by `mobile.yml`'s
#                             `ios-release`)
#   SENTRY_AUTH_TOKEN         secret of the `release` environment, not a
#                             repository secret. Scope `project:releases`.
#                             The symbol-upload jobs (`build`,
#                             `build_desktop`, `build_desktop_linux`,
#                             `build_desktop_windows`, `build_android`)
#                             select that environment on `main` and on `v*`
#                             tags, which is the environment's deployment
#                             branch policy. Any other ref leaves the token
#                             empty, and the upload step warns and continues.
#
# The DSNs stay repository secrets: a DSN is write-only and is not a
# signing credential. The token has no other home, so those jobs do take
# `environment: release` on the refs the policy allows. That also makes
# the other secrets in that environment addressable:
# `CARGO_REGISTRY_TOKEN`, `NPM_TOKEN`, and the App Store Connect key.
# No step added here reads them. `publish_crates` and `publish_npm`
# already did, and they already selected this environment. Selecting
# the environment on every ref would reject a dry run from another
# branch before it compiled, because the policy is `main` and `v*` only.
#
# **A build without these secrets keeps working, and that is a
# requirement.** `outl-telemetry` reads the DSN through `option_env!` at
# compile time: unset means the constant is `None` and the reporter is a
# no-op. So a fork, a pull request from outside the repo, and this repo
# before the secrets exist all produce a working binary that reports
# nothing. No step gates on a secret being present, and none may start
# to — an `if` that fails on an empty DSN is what would break them.
# ------------------------------------------------------------------

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Runs every build and every check against the branch it is
      # dispatched on, and touches nothing outside this run: no tag, no
      # draft release, no asset upload, no tap bump, no npm or crates.io
      # publish. A change to this file, or to a step only this workflow
      # runs (the strip gates, the bundlers), is otherwise first exercised
      # by the beta it cuts on main. Push events carry no inputs, so they
      # read this as false and behave exactly as before.
      dry_run:
        description: "Build and verify every artifact, publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Only one release job per ref. New push cancels the in-flight one.
  # Bump the suffix if a job gets stuck queued and GitHub can't cancel
  # it (happened with macos-13 in v1/v2 — runner pool was depleted).
  group: release-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Compute version
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      base: ${{ steps.compute.outputs.base }}
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      prerelease: ${{ steps.compute.outputs.prerelease }}
      create_tag: ${{ steps.compute.outputs.create_tag }}
      dry_run: ${{ steps.compute.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: compute
        shell: bash
        run: |
          BASE=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Manual GA tag: trust the tag verbatim.
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            CREATE_TAG="false"
          else
            # Auto beta from main push (or workflow_dispatch).
            VERSION="${BASE}-beta.${{ github.run_number }}"
            TAG="v${VERSION}"
            CREATE_TAG="true"
          fi

          DRY_RUN='${{ inputs.dry_run == true }}'
          if [[ "${DRY_RUN}" == "true" ]]; then
            CREATE_TAG="false"
          fi

          # Anything containing -alpha / -beta / -rc is a prerelease.
          if [[ "${VERSION}" == *-alpha* || "${VERSION}" == *-beta* || "${VERSION}" == *-rc* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${CREATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "::notice::Building ${TAG} (prerelease=${PRERELEASE}, dry_run=${DRY_RUN})"

  tag:
    name: Create tag
    needs: prepare
    if: needs.prepare.outputs.create_tag == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Push tag
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::notice::Tag ${TAG} already exists on origin; skipping create."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}"
          git push origin "${TAG}"

  create_release:
    name: Create draft release
    needs: [prepare, tag]
    # `tag` is skipped for tag-triggered runs; don't let that fail us.
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.dry_run != 'true' &&
      (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      # Check out the commit, not the tag we just pushed. The runner
      # fetches through a caching git mirror, and that mirror can be hours
      # behind: this job died on `A branch or tag with the name
      # 'v0.12.0-beta.176' could not be found` while the tag was already on
      # origin, and the same fetch also missed beta.174 and beta.175 from
      # runs seven hours earlier. `github.sha` is what the `tag` job tagged,
      # so it names the same tree and is already in the mirror.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create release as draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          PRERELEASE_FLAG=()
          if [[ '${{ needs.prepare.outputs.prerelease }}' == 'true' ]]; then
            PRERELEASE_FLAG=( --prerelease )
          fi
          # Idempotent: a re-run after partial failure may find the
          # release already there. As long as it's still a draft we
          # can keep uploading; once published+immutable, give up.
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)
            if [[ "${IS_DRAFT}" == "true" ]]; then
              echo "::notice::Release ${TAG} already exists as draft; reusing."
              exit 0
            fi
            echo "::error::Release ${TAG} already exists and is not a draft; refusing to clobber."
            exit 1
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            "${PRERELEASE_FLAG[@]}" \
            --title "outl ${VERSION}" \
            --generate-notes \
            --target "${{ github.sha }}"

  build:
    name: build ${{ matrix.target }}
    needs: [prepare, create_release]
    if: >-
      !cancelled() &&
      (needs.create_release.result == 'success' ||
       (needs.prepare.outputs.dry_run == 'true' && needs.create_release.result == 'skipped'))
    runs-on: ${{ matrix.os }}
    # See the secrets block at the top: the token is in this environment.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    # Two separate things keep an `optional` leg from holding back the
    # platforms that did build, and it is worth being precise about which
    # does what, because the weaker one is the one that looks sufficient.
    #
    #   * This line keeps the *workflow run* from going red over a leg that
    #     is still in bring-up.
    #   * `publish_release` not reading job results at all is what keeps the
    #     release moving. It reads the draft's asset list against
    #     `scripts/release_assets.py`: a missing required asset fails the
    #     publish, a missing optional one publishes with the gap named in the
    #     release notes. That holds whatever conclusion a half-failed matrix
    #     reports to `needs`, which is exactly why the gate is written that
    #     way.
    #
    # `required` lives in that table, and this line is what lets it mean
    # anything here — `check-release-assets.py --manifest` fails if the two
    # disagree, or if this line goes away.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `bottle_tag` names the Homebrew bottle built from the same
          # binary (see the "Stage Homebrew bottle" step). We tag the
          # oldest macOS we support rather than the runner's own
          # version: Homebrew falls back to bottles built for older
          # macOS releases, so `ventura` covers 13 and everything
          # above it — including macOS versions that have no runner
          # yet. Windows has no bottle (Homebrew doesn't run there).
          #
          # `split_debuginfo` overrides `[profile.release]`'s `packed` per
          # platform, because `sentry-cli debug-files upload` does not accept
          # the same container everywhere. Its types are dSYM, PDB, ELF,
          # Breakpad, WASM and friends — a Linux `.dwp` is in none of them, so
          # `packed` there would leave the ELF holding skeleton sections and
          # ship the real DWARF to a file nothing reads. `off` keeps the DWARF
          # inside the ELF, which is sentry-cli's canonical Linux input and is
          # also what the `strip` step then removes. Apple keeps `packed` (the
          # .dSYM survives the strip), MSVC's PDB is separate either way.
          - os: blacksmith-6vcpu-macos-15
            target: aarch64-apple-darwin
            artifact: outl-macos-arm64
            bottle_tag: arm64_ventura
            split_debuginfo: packed
          # Cross-compile to Intel macOS from the Apple Silicon
          # runner. We previously used `macos-13` here, but the Intel
          # macOS pool got depleted and jobs sat queued for ~14h
          # before timing out. outl is pure Rust with no system libs
          # that need linking, so cross-compile works cleanly.
          - os: blacksmith-6vcpu-macos-15
            target: x86_64-apple-darwin
            artifact: outl-macos-x64
            bottle_tag: ventura
            split_debuginfo: packed
          # 22.04, not 24.04, and that is the whole point of naming it
          # here: a glibc-linked binary runs on the glibc it was built
          # against *or newer*, never older. Built on 24.04 this tarball
          # carried a `GLIBC_2.38` floor and died on Debian 12, RHEL 9 and
          # Ubuntu 22.04 with `version GLIBC_2.38 not found` — on the
          # distros, in other words, that a user downloading a tarball
          # instead of using a package manager is most likely to be on.
          # 22.04 is glibc 2.35, which covers Debian 12 (2.36) and every
          # Ubuntu LTS still in support. `build_desktop_linux` was pinned
          # for exactly this reason and said so; the CLI leg was not, and
          # the asymmetry was an oversight rather than a decision.
          - os: blacksmith-8vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            artifact: outl-linux-x64
            bottle_tag: x86_64_linux
            split_debuginfo: "off"
          # Native arm64, not a cross-compile from the x64 runner. `ring`
          # and `aws-lc-sys` (rustls' backends, pulled in by iroh) each
          # compile C and assembly, so cross-compiling means a C toolchain
          # per target and a sysroot; a native runner needs neither, and
          # Blacksmith bills ARM at 0.625x.
          #
          # `arm64_linux` is the Homebrew bottle tag for this platform
          # (`Utils::Bottles::Tag#to_sym` standardizes aarch64 to arm64),
          # Tier 1 since Homebrew 5.0.0.
          - os: blacksmith-8vcpu-ubuntu-2204-arm
            target: aarch64-unknown-linux-gnu
            artifact: outl-linux-arm64
            bottle_tag: arm64_linux
            split_debuginfo: "off"
          - os: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
            artifact: outl-windows-x64
            split_debuginfo: packed
          # Windows on ARM, cross-compiled from the same x64 runner rather
          # than on a native ARM one. Two things make that work and both were
          # checked rather than assumed:
          #
          #   * the `windows-2025` image carries
          #     `Microsoft.VisualStudio.Component.VC.Tools.ARM64`, so the MSVC
          #     cross toolchain and linker are already there;
          #   * `aws-lc-sys` (rustls' backend, through iroh) is the one
          #     dependency here that compiles C, and this target needs
          #     `clang-cl` specifically. Its build script looks for clang-cl
          #     on PATH and then inside the VS install
          #     (`VC/Tools/Llvm/*/bin/clang-cl.exe`); the image ships
          #     `VC.Llvm.Clang` + `VC.Llvm.ClangToolset`, so it resolves.
          #
          # No bottle: Homebrew does not run on Windows. Scoop serves this
          # one (`bucket/outl-beta.json`).
          #
          # `optional` until a release has actually shipped it — nothing in
          # this repo had built this triple before.
          - os: blacksmith-4vcpu-windows-2025
            target: aarch64-pc-windows-msvc
            artifact: outl-windows-arm64
            split_debuginfo: packed
            optional: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Patch workspace version to ${{ needs.prepare.outputs.version }}
        shell: bash
        # `cargo set-version` refuses pre-release "downgrades"
        # (0.1.0 -> 0.1.0-beta.42 is semver-less, even though we want
        # the binary to advertise the beta). Doing it with sed is both
        # simpler and bypasses that check. We rewrite every literal
        # `version = "<base>"` in the root manifest — that covers
        # `workspace.package.version` plus the path-dep version pins
        # in `workspace.dependencies`. Crate manifests use
        # `version.workspace = true` and don't need patching.
        run: |
          BASE='${{ needs.prepare.outputs.base }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          sed -i.bak "s|version = \"${BASE}\"|version = \"${VERSION}\"|g" Cargo.toml
          rm Cargo.toml.bak
          grep -n "version" Cargo.toml | head -10

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        env:
          # RFC 0377 condition 2: the DSN is baked in at compile time through
          # `option_env!`, so it belongs to `cargo build`'s environment and
          # not to the binary's. Empty is a supported outcome — see the
          # secrets block at the top of this file.
          OUTL_SENTRY_DSN: ${{ secrets.OUTL_SENTRY_DSN_CLI }}
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: ${{ matrix.split_debuginfo }}
        # `-p outl-cli` names whose feature `sentry` is. `--bin outl` already
        # selects that package, so cargo resolves the feature without it
        # (checked), but then the feature's owner is an inference from a
        # binary name — and a `sentry` feature added to a second crate later
        # would change what this line means without changing the line.
        #
        # `--features sentry` is condition 1, and it is the only place in the
        # repo that turns the reporter on. The feature is off by default so
        # that `cargo build --release` by anyone who cloned this repo links no
        # SDK at all; `cfg(debug_assertions)` could not express that, being
        # false in their release build too.
        run: >-
          cargo build --release
          --target ${{ matrix.target }}
          -p outl-cli --bin outl
          --features sentry

      # Before the strip below, which is the whole reason this runs here and
      # not at the end: it is the last moment the symbols still exist.
      #
      # Best-effort on purpose. Sentry being unreachable must not hold a
      # release, but a silent skip would hand us unreadable crash reports with
      # no explanation months later, so every failure path says so out loud.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: outl
          SENTRY_PROJECT: outl-cli
        run: |
          set -uo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
            note="SENTRY_AUTH_TOKEN is unset, so no debug symbols were uploaded for ${{ matrix.artifact }}. A panic from this build will arrive in Sentry as bare addresses."
            echo "::warning::${note}"
            # A warning and not a failure on purpose: the Sentry
            # projects and this secret are set up by hand, so until
            # that happens every release would fail on a feature that
            # is not configured yet. It reaches the summary page so
            # the state is visible without reading a step log.
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          shopt -s nullglob
          REL="target/${{ matrix.target }}/release"
          # `deps/` as well as the top level: cargo leaves `release/outl.dSYM`
          # as a *symlink* to `release/deps/outl-<hash>.dSYM`, and a directory
          # walk that does not follow links would skip the 293 MB that
          # actually holds the DWARF. Passing both costs nothing — sentry-cli
          # keys on the debug id, so the same file submitted twice is one
          # upload.
          CANDIDATES=(
            "${REL}/outl" "${REL}/outl.exe" "${REL}/outl.pdb"
            "${REL}"/*.dSYM "${REL}"/deps/*.dSYM
          )
          FOUND=()
          for f in "${CANDIDATES[@]}"; do
            [[ -e "$f" ]] && FOUND+=("$f")
          done
          if [[ ${#FOUND[@]} -eq 0 ]]; then
            note="no debug files under ${REL} for ${{ matrix.artifact }}; nothing uploaded"
            # Reaching here means the token IS set, so Sentry is
            # configured and this is not an outage: it is our own
            # build no longer putting debug files where this step
            # looks (a changed `split-debuginfo`, a Tauri staging
            # path, an AGP task). Deterministic, ours, and permanent
            # for the version being cut — so on a version tag it
            # fails the job rather than shipping a release whose
            # crashes can never symbolicate. "Sentry must not hold a
            # release" is an argument about Sentry being down, which
            # is the branch below, not this one.
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::${note}"
              echo "- symbols: FAILED, ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            echo "::warning::${note}"
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          echo "uploading: ${FOUND[*]}"
          # npx, not `getsentry/action-release`: that action runs in a Docker
          # container and so cannot run on the macOS and Windows legs of this
          # matrix. The npm package is the same CLI, pinned, on all three.
          if ! npx --yes @sentry/cli@3.8.0 debug-files upload "${FOUND[@]}"; then
            note="sentry-cli failed to upload debug symbols for ${{ matrix.artifact }}; the release continues, but crashes from this build will not symbolicate"
            echo "::warning::${note}"
            # Stays a warning, and this is the branch the "a release
            # must not wait on Sentry" argument actually covers.
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      # `[profile.release]` no longer strips (RFC 0377 §5), so this is now the
      # only thing standing between a user and a binary several MB fatter than
      # it needs to be. The "Verify" step below reads the finished archive
      # rather than trusting that this ran.
      - name: Strip the published binary
        shell: bash
        run: |
          set -euo pipefail
          REL="target/${{ matrix.target }}/release"
          case "${{ runner.os }}" in
            macOS)
              # `-x` takes the local symbols and the debug map while leaving
              # the externals a backtrace still needs locally.
              strip -x "${REL}/outl"
              ;;
            Linux)
              strip "${REL}/outl"
              ;;
            Windows)
              echo "::notice::MSVC keeps debug info in a separate outl.pdb, which is never packaged — nothing to strip in outl.exe."
              ;;
          esac

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/outl dist/outl
          cp LICENSE README.md dist/
          tar -C dist -czf ${{ matrix.artifact }}.tar.gz outl LICENSE README.md
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Stage Homebrew bottle
        if: runner.os != 'Windows'
        shell: bash
        # A formula with no bottle is "build from source" to Homebrew,
        # which then runs its fatal dev-tools checks and refuses to
        # install on any Mac whose Xcode trails the running macOS —
        # even though we only unpack a pre-built binary. So we ship the
        # same binary a second time in Homebrew's Cellar layout.
        #
        # The filename is not cosmetic: for a non-ghcr `root_url`,
        # Homebrew resolves the asset as `<name>-<version>.<tag>
        # .bottle.tar.gz` (one dash between name and version — see
        # `Bottle::Filename#url_encode`). Miss it and `brew install`
        # 404s instead of falling back.
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          BOTTLE="outl-beta-${VERSION}.${{ matrix.bottle_tag }}.bottle.tar.gz"
          mkdir -p "bottle/outl-beta/${VERSION}/bin"
          cp dist/outl "bottle/outl-beta/${VERSION}/bin/outl"
          tar -C bottle -czf "${BOTTLE}" outl-beta
          shasum -a 256 "${BOTTLE}" > "${BOTTLE}.sha256"

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/outl.exe dist/outl.exe
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact }}.zip
          $hash = (Get-FileHash ${{ matrix.artifact }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii ${{ matrix.artifact }}.zip.sha256

      # Reads the archive a user downloads, not the binary we think we
      # stripped. The strip used to be one line in `[profile.release]` and
      # applied to every build; it is now a pipeline step, and a pipeline step
      # covers whatever happened to run before it. Reorder these steps, add a
      # leg to the matrix, or drop the strip, and this is the only thing that
      # notices — same reason the Android job reads the finished APK instead
      # of trusting its two alignment steps.
      - name: Verify the staged artifact carries no debug info
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Same filter the upload step uses, and for the same reason:
          # `nullglob` drops a pattern that matches nothing, but these two are
          # literal names, so an absent one would survive and be passed to a
          # script whose whole contract is to fail on a path it cannot read.
          # Each platform stages one of the two.
          CANDIDATES=(
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            outl-beta-*.bottle.tar.gz
          )
          ARTIFACTS=()
          for f in "${CANDIDATES[@]}"; do
            [[ -f "$f" ]] && ARTIFACTS+=("$f")
          done
          if [[ ${#ARTIFACTS[@]} -eq 0 ]]; then
            echo "::error::no staged archive to verify for ${{ matrix.artifact }}"
            exit 1
          fi
          # Git Bash on the Windows runner has `python`, not always `python3`.
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          "${PY}" scripts/check-artifact-stripped.py "${ARTIFACTS[@]}"

      - name: Upload assets to draft release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # `--clobber` lets us re-run a single matrix leg without
        # tripping over an already-uploaded asset from the previous
        # attempt. `nullglob` keeps the loop quiet when one platform
        # only produces .tar.gz and the other only .zip.
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          shopt -s nullglob
          ASSETS=(
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.tar.gz.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
            outl-beta-*.bottle.tar.gz
            outl-beta-*.bottle.tar.gz.sha256
          )
          STAGED=()
          for f in "${ASSETS[@]}"; do
            [[ -f "$f" ]] && STAGED+=("$f")
          done
          if [[ ${#STAGED[@]} -eq 0 ]]; then
            echo "::error::no assets staged for ${{ matrix.artifact }}"
            exit 1
          fi
          gh release upload "${TAG}" "${STAGED[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build_desktop:
    name: build desktop macOS (universal)
    needs: [prepare, create_release]
    if: >-
      !cancelled() &&
      (needs.create_release.result == 'success' ||
       (needs.prepare.outputs.dry_run == 'true' && needs.create_release.result == 'skipped'))
    runs-on: blacksmith-6vcpu-macos-15
    # See the secrets block at the top: the token is in this environment.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    # Single universal dmg instead of a matrix split. Tauri 2's
    # `--target universal-apple-darwin` builds both aarch64 and
    # x86_64 binaries on the arm64 runner and `lipo`-merges them
    # into one .app that runs on both architectures. Benefits:
    #
    #   * One runner instead of two. `macos-13` (Intel) runner pool
    #     is consistently depleted — we previously had jobs queued
    #     for ~14h. Universal sidesteps that entirely.
    #   * One dmg, one sha, one cask URL. Cask file is much
    #     simpler (no `arch arm:`/`intel:` split), `update_tap` has
    #     one anchor to patch.
    #   * The dmg is ~2× bigger (carries both archs), which for
    #     outl-desktop's ~20MB binaries means ~40MB. Fine.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain (arm64 + x86_64 targets)
        # Plain `rustup target add` instead of `dtolnay/rust-toolchain`
        # because the macOS runner ships with `stable` pre-installed
        # for the host arch only, and the action's `targets:` input
        # is a no-op when the toolchain is already present. The CLI
        # `build` job above uses the same pattern for the same reason.
        run: |
          rustup show
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Patch workspace version to ${{ needs.prepare.outputs.version }}
        shell: bash
        # Same sed pass as the CLI/TUI `build` job. We rewrite every
        # literal `version = "<base>"` in the root manifest. Crate
        # manifests use `version.workspace = true` and don't need
        # patching, including `crates/outl-desktop/src-tauri/Cargo.toml`.
        run: |
          BASE='${{ needs.prepare.outputs.base }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          sed -i.bak "s|version = \"${BASE}\"|version = \"${VERSION}\"|g" Cargo.toml
          rm Cargo.toml.bak

      - name: Cache cargo (desktop universal)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-universal-apple-darwin-desktop-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: bun install

      - name: Build universal dmg
        # `--target universal-apple-darwin` triggers Tauri's universal
        # build path: compile arm64 + x86_64 → `lipo` merge → embed in
        # `outl.app` → package as dmg.
        #
        # `--bundles dmg` skips the .app-only export the macOS path
        # would otherwise also produce — we ship the dmg as the
        # cask source.
        #
        # `RUSTFLAGS=-C strip=symbols` instead of a strip step, because
        # `tauri build` compiles and seals the dmg in one command: there is no
        # moment afterwards at which the binary inside it can still be
        # stripped. Stripping at link time is the only seam, and it costs
        # nothing here — with `split-debuginfo = "packed"` rustc runs dsymutil
        # *before* applying the strip, so `target/<arch>/release/outl.dSYM`
        # survives for the upload below (measured: 463 KB → 340 KB binary,
        # dSYM intact).
        #
        # Setting `RUSTFLAGS` REPLACES any `[target.*] rustflags` from
        # `.cargo/config.toml` rather than merging, which that file warns
        # about. Safe here: the only entries there are the two
        # `*-linux-android` targets, and this job builds neither.
        #
        # `TAURI_BUNDLER_DMG_IGNORE_CI` is what lets the branded install
        # window configured in `tauri.conf.json` (`bundle.macOS.dmg`) reach a
        # release at all. tauri-bundler passes `--skip-jenkins` to its
        # vendored `bundle_dmg.sh` whenever `CI == "true"` unless that
        # variable is set, and `--skip-jenkins` skips the AppleScript step
        # wholesale. The script says so itself: "This will result in a DMG
        # without any custom background or icons positioning." Checked
        # against the strings in the `@tauri-apps/cli` 2.12.3 binary this
        # repo resolves, not against the documentation.
        #
        # The retry is not belt-and-braces. That AppleScript drives Finder
        # over Apple Events, so it needs the runner to grant Automation
        # permission, and the bundler carries a dedicated error for being
        # refused it (`-1743`). The dmg is a `required` asset in
        # `scripts/release_assets.py`, so with no fallback a background image
        # would be able to hold back the entire macOS release — the exact
        # failure shape the asset gate exists to remove. The second pass is
        # cheap: the compile is already done and cached, only the bundling
        # re-runs.
        working-directory: crates/outl-desktop
        env:
          OUTL_SENTRY_DSN: ${{ secrets.OUTL_SENTRY_DSN_DESKTOP }}
          RUSTFLAGS: "-C strip=symbols"
        shell: bash
        run: |
          set -uo pipefail
          args=(--target universal-apple-darwin --bundles dmg --features sentry)
          if TAURI_BUNDLER_DMG_IGNORE_CI=true bun run tauri build "${args[@]}"; then
            exit 0
          fi
          note="the branded dmg window failed to apply; fell back to the stock dmg"
          echo "::warning::${note}"
          echo "- dmg: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          # A refused or half-run AppleScript leaves the volume mounted and a
          # partial dmg on disk; the second pass trips over both.
          unset TAURI_BUNDLER_DMG_IGNORE_CI
          for vol in /Volumes/outl*; do
            if [ -d "${vol}" ]; then
              hdiutil detach "${vol}" -force || true
            fi
          done
          rm -f target/universal-apple-darwin/release/bundle/dmg/*.dmg
          bun run tauri build "${args[@]}"

      # The .dSYM is per-architecture: Tauri builds aarch64 and x86_64
      # separately and `lipo`-merges them, so the universal directory holds
      # the merged binary and no debug companion of its own.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: outl
          SENTRY_PROJECT: outl
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          # `deps/` too, because `release/outl.dSYM` is a symlink into it and
          # a link-averse directory walk would skip the real bundle. See the
          # same note on the CLI job's upload step.
          FOUND=(
            target/aarch64-apple-darwin/release/*.dSYM
            target/aarch64-apple-darwin/release/deps/*.dSYM
            target/x86_64-apple-darwin/release/*.dSYM
            target/x86_64-apple-darwin/release/deps/*.dSYM
          )
          if [[ ${#FOUND[@]} -eq 0 ]]; then
            note="no .dSYM under target/{aarch64,x86_64}-apple-darwin/release — check that [profile.release] still sets split-debuginfo = \"packed\"; nothing uploaded"
            # The token may or may not be set. Either way a version tag with
            # no debug file ships a release whose crashes cannot symbolicate,
            # and that is our build, not Sentry being down.
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::${note}"
              echo "- symbols: FAILED, ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            echo "::warning::${note}"
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          bash scripts/upload-sentry-debug-files.sh "desktop@${VERSION}" "the macOS desktop build" "${FOUND[@]}"

      - name: Stage dmg + sha256
        shell: bash
        # Tauri's universal output name is
        # `<productName>_<version>_universal.dmg`. We rename to
        # `outl-desktop-macos.dmg` (no `-arm64`/`-x64` suffix —
        # there's only one dmg) so `update_tap` patches a single
        # anchor in the cask.
        #
        # The dmg is unsigned. Adding a Developer ID + notarytool
        # step lands when we register the Apple Developer account;
        # the cask carries a `caveats` block explaining the
        # `xattr -dr com.apple.quarantine` workaround in the meantime.
        run: |
          set -euo pipefail
          VERSION='${{ needs.prepare.outputs.version }}'
          SRC="target/universal-apple-darwin/release/bundle/dmg/outl_${VERSION}_universal.dmg"
          DST="outl-desktop-macos.dmg"
          if [[ ! -f "${SRC}" ]]; then
            echo "::error::expected universal dmg at ${SRC} (run produced:)"
            find target/universal-apple-darwin/release/bundle -name '*.dmg' -print
            exit 1
          fi
          cp "${SRC}" "${DST}"
          shasum -a 256 "${DST}" > "${DST}.sha256"

      # Mount what we are about to publish and read the binary out of it. The
      # link-time strip above is invisible from the outside, and the dmg is
      # the only place its effect can be confirmed.
      - name: Verify the dmg carries no debug info
        shell: bash
        run: |
          set -euo pipefail
          MNT="${RUNNER_TEMP}/dmg-verify"
          rm -rf "${MNT}"
          mkdir -p "${MNT}"
          hdiutil attach outl-desktop-macos.dmg -nobrowse -readonly -mountpoint "${MNT}"
          # Detach even when the check fails, or the runner keeps the volume.
          trap 'hdiutil detach "${MNT}" -quiet || true' EXIT
          APP=$(find "${MNT}" -maxdepth 1 -name '*.app' | head -1)
          if [[ -z "${APP}" ]]; then
            echo "::error::no .app inside outl-desktop-macos.dmg (volume holds:)"
            ls -la "${MNT}"
            exit 1
          fi
          python3 scripts/check-artifact-stripped.py "${APP}"

      - name: Upload dmg to draft release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ needs.prepare.outputs.tag }}'
          gh release upload "${TAG}" \
            "outl-desktop-macos.dmg" \
            "outl-desktop-macos.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build_desktop_linux:
    name: build desktop Linux (${{ matrix.arch }})
    needs: [prepare, create_release]
    if: >-
      !cancelled() &&
      (needs.create_release.result == 'success' ||
       (needs.prepare.outputs.dry_run == 'true' && needs.create_release.result == 'skipped'))
    runs-on: ${{ matrix.os }}
    # See the secrets block at the top: the token is in this environment.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    # See the `build` job for what this does and, more to the point, what it
    # does not do: the release keeps moving because `publish_release` reads
    # assets instead of job results.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both legs are pinned to 22.04 on purpose: AppImage/.deb/.rpm
          # link against the runner's glibc + webkit2gtk, so building on
          # the oldest supported image gives the widest downstream
          # compatibility. 24.04 would raise the floor from glibc 2.35 to
          # 2.39 and lock out Debian 12 and Ubuntu 22.04 — on arm64 that
          # is Raspberry Pi OS bookworm, which is most of the hardware
          # this leg exists for.
          #
          # Native arm64 rather than a cross-compile: the bundlers link
          # against the runner's own webkit2gtk / gtk3 and linuxdeploy
          # copies those libraries out of `/usr/lib/<triple>`, so a
          # cross-build would need the whole GTK stack in a sysroot. A
          # native runner needs none of it, and Blacksmith bills ARM at
          # 0.625x.
          #
          # `apprun_sha256` pins the prebuilt launcher this job strips
          # and seeds into Tauri's tool cache (see the seed step below).
          # Both files come from the same mutable `apprun-old` release,
          # so each is pinned by digest, per arch.
          #
          # The aarch64 leg is `optional`, so a bundler problem on one
          # architecture cannot hold back the other one — or macOS, or
          # Windows. What it cannot do is fail quietly: `publish_release`
          # reads the draft's assets against `scripts/release_assets.py` and
          # names every missing one in the release notes, and `update_tap`
          # refuses to move a manifest whose assets are not all there.
          # Promoting the leg is flipping `required` in that table, which is
          # also the record that it has been green. `workflow_dispatch` with
          # `dry_run: true` builds and verifies every artifact on a branch
          # without publishing, which is how a change to this job gets
          # exercised first.
          - arch: x86_64
            os: blacksmith-8vcpu-ubuntu-2204
            target: x86_64-unknown-linux-gnu
            apprun_sha256: f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f
          - arch: aarch64
            os: blacksmith-8vcpu-ubuntu-2204-arm
            target: aarch64-unknown-linux-gnu
            apprun_sha256: 072f17c0895a85c490282fe5395c5007e5fc75da727e553b3b8fb680feb11578
            optional: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # Tauri 2 system deps. Same set the `desktop.yml` CI job installs;
      # the bundler links these into the AppImage and references them
      # from the .deb/.rpm dependency lists.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      # The AppImage's launcher is not ours, and it is not stripped either.
      # Tauri copies `AppRun-<arch>` from its tool cache into the AppDir
      # (linuxdeploy's gtk plugin then renames it `AppRun.wrapped`), and
      # downloads it from tauri-apps/binary-releases only when the cache has
      # none. That prebuilt binary carries DWARF and a `.symtab`. Once
      # linuxdeploy has sealed the squashfs it cannot be changed, so the
      # cache is the one place to strip it: seed it with a stripped copy of
      # the same file. If Tauri ever renames or moves it, the seed is simply
      # not used and the strip gate below goes red on `AppRun.wrapped`,
      # which is the signal to update this step.
      #
      # The name is the one `tauri-bundler` derives from the build target
      # (`settings.target().split('-').next()`), so it is `x86_64` and
      # `aarch64` — not the `amd64` / `arm64` spelling the same bundler
      # uses for the .deb.
      - name: Seed Tauri's AppImage launcher, stripped
        shell: bash
        env:
          APPRUN_ARCH: ${{ matrix.arch }}
          # apprun-old is a mutable release asset, so pin the bytes we strip
          # and ship. Bump the digest only after checking the new upload.
          APPRUN_SHA256: ${{ matrix.apprun_sha256 }}
        run: |
          set -euo pipefail
          TOOLS="${XDG_CACHE_HOME:-${HOME}/.cache}/tauri"
          mkdir -p "${TOOLS}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 5 --retry-connrefused \
            -o "${TOOLS}/AppRun-${APPRUN_ARCH}" \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-${APPRUN_ARCH}"
          echo "${APPRUN_SHA256}  ${TOOLS}/AppRun-${APPRUN_ARCH}" | sha256sum -c -
          strip "${TOOLS}/AppRun-${APPRUN_ARCH}"
          chmod +x "${TOOLS}/AppRun-${APPRUN_ARCH}"
          python3 scripts/check-artifact-stripped.py "${TOOLS}/AppRun-${APPRUN_ARCH}"

      - name: Patch workspace version to ${{ needs.prepare.outputs.version }}
        shell: bash
        # Same sed pass as the other build jobs: rewrite every literal
        # `version = "<base>"` in the root manifest so the bundled app
        # advertises the beta version. Crate manifests inherit via
        # `version.workspace = true`.
        run: |
          BASE='${{ needs.prepare.outputs.base }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          sed -i.bak "s|version = \"${BASE}\"|version = \"${VERSION}\"|g" Cargo.toml
          rm Cargo.toml.bak

      - name: Cache cargo (desktop linux)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-desktop-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: bun install

      - name: Build the Linux desktop binary
        # Compile only. Bundling happens after the symbol upload and the
        # strip, so the file sentry-cli reads still holds DWARF and the
        # AppImage / deb / rpm do not.
        #
        # `split-debuginfo = packed` (the workspace profile) writes a `.dwp`.
        # sentry-cli accepts an ELF, a dSYM, a PDB, Breakpad and WASM — not a
        # `.dwp` — so this job overrides the profile to `off` and uploads
        # `target/release/outl-desktop` itself. No `strip=symbols` at link
        # time: that would delete the DWARF before the upload step can see it.
        # `[profile.release]` keeps `debug = "line-tables-only"`, which is the
        # file names and line numbers a stack needs, without full variable
        # locations.
        #
        # Setting `RUSTFLAGS` would replace `.cargo/config.toml`'s rustflags
        # rather than merge. This step sets none. The only entries in that
        # file are the two `*-linux-android` targets, and this job builds
        # neither.
        working-directory: crates/outl-desktop
        env:
          OUTL_SENTRY_DSN: ${{ secrets.OUTL_SENTRY_DSN_DESKTOP }}
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: bun run tauri build --no-bundle --features sentry

      # Before the strip. This is the last moment the ELF still holds DWARF.
      # The binary is the debug file: sentry-cli reads an ELF, and a `.dwp`
      # is not a type it accepts. `strip` afterwards keeps the GNU build-id,
      # which is what Sentry matches the uploaded file against.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: outl
          SENTRY_PROJECT: outl
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail
          BIN="target/release/outl-desktop"
          if [[ ! -f "${BIN}" ]]; then
            note="no ${BIN} to upload — the Linux desktop build did not produce the binary the symbol step reads"
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::${note}"
              echo "- symbols: FAILED, ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            echo "::warning::${note}"
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          if ! readelf -S "${BIN}" | grep -q '\.debug_info'; then
            note="${BIN} has no .debug_info section. This job sets CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO=off so the DWARF stays in the ELF; without it a Linux crash cannot symbolicate."
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::${note}"
              echo "- symbols: FAILED, ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            echo "::warning::${note}"
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          bash scripts/upload-sentry-debug-files.sh "desktop@${VERSION}" "the Linux desktop build" "${BIN}"

      - name: Strip the desktop binary
        shell: bash
        run: |
          set -euo pipefail
          strip target/release/outl-desktop

      - name: Bundle Linux deb and AppImage
        # The binary is already stripped. `tauri bundle` packages it; it does
        # not compile. AppImage + deb here, rpm below — the rpm needs a
        # different version string.
        working-directory: crates/outl-desktop
        env:
          # Same override as the compile step. `tauri bundle` should not
          # rebuild; if it does, the binary it packages must still be the
          # ELF layout the upload step read.
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: bun run tauri bundle --bundles deb,appimage --features sentry

      # RPM reserves `-` in Version for the name-version-release separator,
      # and `@tauri-apps/cli` 2.12 started enforcing it: every beta since
      # the bun lockfile refresh died here on
      #
      #   > invalid version "0.12.0-beta.238": contains invalid character
      #
      # RPM's own `0.12.0~beta.238` is not semver, and Tauri refuses any
      # config `version` that is not. So a pre-release is spelled the way
      # Fedora's packaging guidelines spelled it before `~` existed: the base
      # version, and the pre-release in a Release that starts with `0.`
      # (`outl-0.12.0-0.beta.238`). That sorts before the GA's default
      # Release `1`, so `dnf` treats the GA as the upgrade it is.
      #
      # `tauri bundle` packages the binary `tauri build` already produced
      # rather than compiling again, so the rpm carries the same stripped
      # `outl-desktop`, and that binary still reports `0.12.0-beta.N`. A GA
      # version has no `-` and is bundled with the config as is.
      - name: Build Linux rpm
        working-directory: crates/outl-desktop
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: |
          set -euo pipefail
          CONFIG=()
          if [[ "${VERSION}" == *-* ]]; then
            PRE="${VERSION#*-}"
            RPM_CONFIG="{\"version\": \"${VERSION%%-*}\", \"bundle\": {\"linux\": {\"rpm\": {\"release\": \"0.${PRE//-/.}\"}}}}"
            echo "rpm config: ${RPM_CONFIG}"
            CONFIG=( --config "${RPM_CONFIG}" )
          fi
          bun run tauri bundle --bundles rpm --features sentry "${CONFIG[@]}"

      - name: Stage bundles + sha256
        shell: bash
        # Tauri's Linux output names carry the version + arch, and each
        # bundler spells the arch its own way
        # (`outl_<version>_amd64.AppImage`, `outl_<version>_arm64.deb`,
        # `outl-<version>-1.aarch64.rpm`). Rename to stable, version-less
        # asset names so the release URLs don't churn between builds — and
        # to one spelling, `aarch64`, which is what Linux packaging uses
        # and what issue #411 asked for. The globs below match whatever
        # the bundler wrote; the destination names are ours.
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          BUNDLE="target/release/bundle"
          declare -A MAP=(
            [appimage/*.AppImage]="outl-desktop-linux-${ARCH}.AppImage"
            [deb/*.deb]="outl-desktop-linux-${ARCH}.deb"
            [rpm/*.rpm]="outl-desktop-linux-${ARCH}.rpm"
          )
          shopt -s nullglob
          for glob in "${!MAP[@]}"; do
            matches=( ${BUNDLE}/${glob} )
            if [[ ${#matches[@]} -eq 0 ]]; then
              echo "::error::no bundle matched ${BUNDLE}/${glob} (run produced:)"
              find "${BUNDLE}" -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print
              exit 1
            fi
            dst="${MAP[$glob]}"
            cp "${matches[0]}" "${dst}"
            shasum -a 256 "${dst}" > "${dst}.sha256"
          done

      # Two extractions, because each bundler copies the binary itself rather
      # than sharing one. The AppImage unpacks itself (`--appimage-extract`
      # needs no FUSE, which the runner has no kernel module for) and
      # `dpkg-deb` is core on Ubuntu. The rpm is extracted below with
      # `bsdtar` from `libarchive-tools`, which the step installs.
      - name: Verify the Linux bundles carry no debug info
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/bundle-verify"
          rm -rf "${WORK}"
          mkdir -p "${WORK}/appimage" "${WORK}/deb" "${WORK}/rpm"

          # Runs the AppImage we just built, which is only possible because
          # each leg builds on its own architecture. A cross-build would
          # have to unpack the squashfs by hand instead.
          chmod +x "outl-desktop-linux-${ARCH}.AppImage"
          ( cd "${WORK}/appimage" \
            && "${GITHUB_WORKSPACE}/outl-desktop-linux-${ARCH}.AppImage" --appimage-extract >/dev/null )

          dpkg-deb -x "outl-desktop-linux-${ARCH}.deb" "${WORK}/deb"

          # The rpm is packaged by a separate `tauri bundle` call, so read
          # its payload too instead of trusting it matches the deb. bsdtar,
          # not rpm2cpio: rpm2cpio exits 1 without a word when the copied
          # payload doesn't match the header's archive size, which is the
          # case for the rpm Tauri writes.
          sudo apt-get install -y --no-install-recommends libarchive-tools
          bsdtar -xf "outl-desktop-linux-${ARCH}.rpm" -C "${WORK}/rpm"
          test -s "${WORK}/rpm/usr/bin/outl-desktop"

          python3 scripts/check-artifact-stripped.py "${WORK}/appimage" "${WORK}/deb" "${WORK}/rpm"

      - name: Upload bundles to draft release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          gh release upload "${TAG}" \
            "outl-desktop-linux-${ARCH}.AppImage" \
            "outl-desktop-linux-${ARCH}.AppImage.sha256" \
            "outl-desktop-linux-${ARCH}.deb" \
            "outl-desktop-linux-${ARCH}.deb.sha256" \
            "outl-desktop-linux-${ARCH}.rpm" \
            "outl-desktop-linux-${ARCH}.rpm.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build_desktop_windows:
    name: build desktop Windows (${{ matrix.arch }})
    needs: [prepare, create_release]
    if: >-
      !cancelled() &&
      (needs.create_release.result == 'success' ||
       (needs.prepare.outputs.dry_run == 'true' && needs.create_release.result == 'skipped'))
    runs-on: blacksmith-4vcpu-windows-2025
    # See the secrets block at the top: the token is in this environment.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    # See the `build` job for what this does and does not do.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One x64 runner builds both, because the arm64 half is a
          # cross-compile: `windows-2025` carries `VC.Tools.ARM64`, Tauri's
          # NSIS path knows `Arch::AArch64` (it writes `arm64` into the
          # installer and pulls the matching WebView2 bootstrapper), and
          # `makensis` itself runs on the host. A native Windows-on-ARM
          # runner would need `bun` under x64 emulation for the frontend
          # build, which is a worse trade than cross-linking Rust.
          #
          # Both legs pass `--target` explicitly. The x64 leg used to build
          # for the host and read `target/release/...`; parameterising that
          # path for arm64 and leaving x64 on the host default would have
          # been two layouts to keep straight, so both now use
          # `target/<triple>/release/...`.
          #
          # `optional` on arm64 until a release has shipped it.
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            optional: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Patch workspace version to ${{ needs.prepare.outputs.version }}
        shell: bash
        # Same sed pass as the other build jobs. `shell: bash` on the
        # Windows runner is Git Bash, which ships GNU sed.
        run: |
          BASE='${{ needs.prepare.outputs.base }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          sed -i.bak "s|version = \"${BASE}\"|version = \"${VERSION}\"|g" Cargo.toml
          rm Cargo.toml.bak

      - name: Cache cargo (desktop windows)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-desktop-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: bun install

      - name: Build NSIS installer
        working-directory: crates/outl-desktop
        # NSIS only — NOT the `"targets": "all"` the conf asks for, and
        # not a preference. `tauri-bundler`'s WiX path runs every version
        # through `convert_version`, which bails on a pre-release
        # identifier that isn't numeric-only:
        #
        #   > optional pre-release identifier in app version must be
        #   > numeric-only and cannot be greater than 65535 for msi target
        #
        # Every build here is a beta (`0.12.0-beta.201`), so `-beta.201`
        # fails `pre.parse::<u64>()` and the msi leg would fail the job
        # after the Rust build has already been paid for. NSIS has no
        # such check: it warns and writes `X.Y.Z.0` into
        # `VIProductVersion`, which is the Windows-facing field, and
        # keeps the full string in the filename and the UI.
        #
        # NSIS is also the installer Tauri recommends on Windows — it
        # carries the WebView2 bootstrapper, msi does not.
        #
        # No `RUSTFLAGS` strip here, unlike the other two desktop jobs: MSVC
        # writes debug info to a separate `.pdb` that the installer never
        # packages, so the `.exe` is already lean and the strip would only
        # cost us the symbol names. The verify step below is what confirms
        # that rather than asserting it.
        env:
          OUTL_SENTRY_DSN: ${{ secrets.OUTL_SENTRY_DSN_DESKTOP }}
        run: bun run tauri build --target ${{ matrix.target }} --bundles nsis --features sentry

      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: outl
          SENTRY_PROJECT: outl
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          REL="target/${{ matrix.target }}/release"
          FOUND=( "${REL}"/*.pdb "${REL}"/*.exe )
          if [[ ${#FOUND[@]} -eq 0 ]]; then
            note="no .pdb or .exe under ${REL}; nothing uploaded"
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::${note}"
              echo "- symbols: FAILED, ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            echo "::warning::${note}"
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          bash scripts/upload-sentry-debug-files.sh "desktop@${VERSION}" "the Windows desktop build" "${FOUND[@]}"

      - name: Stage installer + sha256
        shell: pwsh
        # Tauri's NSIS output name carries the version and arch
        # (`outl_<version>_x64-setup.exe`, `outl_<version>_arm64-setup.exe`).
        # Rename to a stable, version-less asset name so the release URL
        # doesn't churn between builds — same rule as the Linux bundles, and
        # the same `x86_64` / `aarch64` spelling, so the desktop assets read
        # the same on both operating systems.
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "target/$env:TRIPLE/release/bundle"
          $installer = Get-ChildItem -Path "$bundle/nsis" -Filter '*-setup.exe' -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $installer) {
            Write-Output "::error::no NSIS installer under $bundle/nsis (run produced:)"
            if (Test-Path $bundle) {
              Get-ChildItem -Path $bundle -Recurse -File | ForEach-Object { $_.FullName }
            }
            exit 1
          }
          $dst = "outl-desktop-windows-$env:ARCH-setup.exe"
          Copy-Item $installer.FullName $dst
          $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
          "$hash  $dst" | Out-File -Encoding ascii "$dst.sha256"

      # **Declared gap: this reads the packaged binary, not the installer.**
      # The NSIS container would need 7-Zip's NSIS handler to open, and
      # failing a release on a quirk of that handler buys nothing here: the
      # question on Windows is only whether MSVC's debug info stayed in the
      # separate `.pdb`, and `outl.exe` is where that is visible. The CLI
      # job's Windows leg does read its published `.zip`, so the sibling path
      # is covered end to end.
      - name: Verify the packaged binary carries no debug info
        shell: bash
        run: |
          set -euo pipefail
          PY=python3
          command -v python3 >/dev/null 2>&1 || PY=python
          # `outl-desktop.exe`, the Cargo binary name: Tauri's "Built
          # application at" line names it, and `productName` (`outl`) is
          # only what the installer calls it.
          "${PY}" scripts/check-artifact-stripped.py "target/${{ matrix.target }}/release/outl-desktop.exe"

      - name: Upload installer to draft release
        if: needs.prepare.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          gh release upload "${TAG}" \
            "outl-desktop-windows-${ARCH}-setup.exe" \
            "outl-desktop-windows-${ARCH}-setup.exe.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build_android:
    name: build Android (arm64 APK)
    needs: [prepare, create_release]
    if: >-
      !cancelled() &&
      (needs.create_release.result == 'success' ||
       (needs.prepare.outputs.dry_run == 'true' && needs.create_release.result == 'skipped'))
    runs-on: blacksmith-8vcpu-ubuntu-2404
    # See the secrets block at the top: the token is in this environment.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && 'release' || '' }}
    # Optimized (release-build) APK, debug-signed, attached to the GitHub
    # Release (no Google Play). Like iOS, the build is RELEASE (optimized);
    # only the *signature* is a throwaway debug key — a real upload
    # keystore + Play track are tracked in issue #171. Mirrors the iOS
    # `mobile.yml` shape — Rust + Android target + NDK + Bun frontend +
    # `cargo tauri android build`, version injected via `--config` (Tauri's
    # mobile path does NOT fall back to Cargo.toml — see
    # `crates/outl-mobile/CLAUDE.md`).
    # A failure here never blocks the release: `publish_release` waits for
    # this job but does not require its success (see its `if`).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain (Android arm64 target)
        run: |
          rustup show
          rustup target add aarch64-linux-android
          rustup target list --installed

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android NDK
        shell: bash
        # Pin the same NDK the project builds against locally. Export both
        # names Tauri/cargo-ndk look for so `cargo tauri android build`
        # finds the toolchain without a local.properties.
        #
        # The runner image does not ship 27.1, so every run downloads ~700 MB
        # and a truncated transfer is a routine outcome: beta.207 died on
        # `An error occurred while preparing SDK package NDK (Side by side)
        # 27.1.12297006: Error reading Zip content from a SeekableByteChannel`
        # at 33%. `sdkmanager` logs that as a *Warning* and still exits 1, so
        # it reads like a pinned-version problem and is a bad download.
        #
        # Retrying only helps if the partial zip goes with it, hence the
        # `rm -rf` of both the half-unzipped target and sdkmanager's download
        # scratch. The success gate is the clang `cargo-ndk` will invoke, not
        # the exit code: a package that unzipped partially can still leave
        # `source.properties` behind and claim to be installed.
        run: |
          set -euo pipefail
          # Checked before the `rm -rf` below reaches for it: `set -u` catches
          # an unset variable but not an empty one, and an empty prefix turns
          # the cleanup into `rm -rf /ndk/...`.
          : "${ANDROID_SDK_ROOT:?unset; android-actions/setup-android did not run}"
          NDK_VERSION=27.1.12297006
          NDK="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          CLANG="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          for attempt in 1 2 3; do
            if sdkmanager --install "ndk;${NDK_VERSION}" && [[ -x "${CLANG}" ]]; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::NDK ${NDK_VERSION} did not install after 3 attempts"
              exit 1
            fi
            echo "::warning::NDK install attempt ${attempt} left no usable toolchain; discarding the partial download and retrying"
            rm -rf "${NDK}" "${ANDROID_SDK_ROOT}/.downloadIntermediates"
            sleep $(( attempt * 15 ))
          done
          echo "NDK_HOME=${NDK}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK}" >> "$GITHUB_ENV"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Patch workspace version to ${{ needs.prepare.outputs.version }}
        shell: bash
        # Same sed pass as the other build jobs (keeps the Rust crate
        # version aligned). The APK's user-facing versionName comes from
        # `--config` below, not from here.
        run: |
          BASE='${{ needs.prepare.outputs.base }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          sed -i.bak "s|version = \"${BASE}\"|version = \"${VERSION}\"|g" Cargo.toml
          rm Cargo.toml.bak

      - name: Cache cargo (android)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-aarch64-linux-android-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate debug keystore
        shell: bash
        # No release keystore/secret yet (issue #171). We sign the
        # optimized RELEASE APK with a throwaway Android debug key so it
        # installs via sideload (Play rejects a debug key — fine, GitHub
        # Release only). Same params as the SDK's stock
        # `~/.android/debug.keystore`.
        run: |
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/debug.keystore" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK (arm64)
        working-directory: crates/outl-mobile
        # RELEASE build (Rust optimized + stripped, R8/proguard) — NOT
        # `--debug`, whose unoptimized `.so` + kept debug symbols balloon
        # the APK past 1 GB. `--apk` skips the .aab.
        #
        # `--config` injects the FULL version, `-beta.N` included, so the
        # APK's versionName says which build it is. It used to inject the
        # base version, so every beta of 0.13.0 reported `0.13.0` and a
        # crash report (issue #401) named a range of builds instead of one.
        # versionCode is `github.run_number`, the same counter that names
        # `beta.N`; Tauri's own derivation ignores the prerelease and gave
        # all of them 13000. Starting below that 13000 is harmless because
        # an update here already needs an uninstall (throwaway debug key
        # per release, issue #171). Full reasoning:
        # `docs/android-platform.md` → Release.
        #
        # No `RUSTFLAGS` here, deliberately. `.cargo/config.toml` carries the
        # `max-page-size=16384` link flag for the Android targets, an exported
        # `RUSTFLAGS` REPLACES that rather than merging, and a 4 KB-aligned
        # `.so` is the beta.226 crash-on-open. The strip is AGP's job anyway
        # (see the next two steps).
        env:
          OUTL_SENTRY_DSN: ${{ secrets.OUTL_SENTRY_DSN_MOBILE }}
        run: |
          cargo tauri android build --target aarch64 --apk --features sentry \
            --config "{\"version\": \"${{ needs.prepare.outputs.version }}\", \"bundle\": {\"android\": {\"versionCode\": ${{ github.run_number }}}}}"

      # The unstripped library, before AGP's copy of it reaches the APK.
      #
      # Tauri writes the built `.so` into `gen/android/app/src/main/jniLibs/`
      # (which is why `gen/android/.gitignore` ignores
      # `/src/main/jniLibs/**/*.so`), Gradle merges from there, and the
      # release buildType strips on the way in — so the source copy keeps its
      # symbols after the build and is what Sentry needs. `target/` is passed
      # too, since that is where cargo wrote it and either path alone is one
      # assumption about Tauri's internals.
      - name: Upload debug symbols to Sentry
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: outl
          SENTRY_PROJECT: outl-mobile
        run: |
          set -uo pipefail
          if [[ -z "${SENTRY_AUTH_TOKEN}" ]]; then
            note="SENTRY_AUTH_TOKEN is unset, so no debug symbols were uploaded for the Android build. A panic from this build will arrive in Sentry as bare addresses."
            echo "::warning::${note}"
            # A warning and not a failure on purpose: the Sentry
            # projects and this secret are set up by hand, so until
            # that happens every release would fail on a feature that
            # is not configured yet. It reaches the summary page so
            # the state is visible without reading a step log.
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          shopt -s nullglob
          FOUND=(
            crates/outl-mobile/src-tauri/gen/android/app/src/main/jniLibs/*/*.so
            target/aarch64-linux-android/release/*.so
          )
          if [[ ${#FOUND[@]} -eq 0 ]]; then
            note="no unstripped .so found under gen/android/app/src/main/jniLibs or target/aarch64-linux-android/release — Tauri may have changed where it stages the library; nothing uploaded"
            # Reaching here means the token IS set, so Sentry is
            # configured and this is not an outage: it is our own
            # build no longer putting debug files where this step
            # looks (a changed `split-debuginfo`, a Tauri staging
            # path, an AGP task). Deterministic, ours, and permanent
            # for the version being cut — so on a version tag it
            # fails the job rather than shipping a release whose
            # crashes can never symbolicate. "Sentry must not hold a
            # release" is an argument about Sentry being down, which
            # is the branch below, not this one.
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::${note}"
              echo "- symbols: FAILED, ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
            fi
            echo "::warning::${note}"
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          echo "uploading: ${FOUND[*]}"
          if ! npx --yes @sentry/cli@3.8.0 debug-files upload "${FOUND[@]}"; then
            note="sentry-cli failed to upload debug symbols for the Android build; the release continues, but crashes from this build will not symbolicate"
            echo "::warning::${note}"
            # Stays a warning, and this is the branch the "a release
            # must not wait on Sentry" argument actually covers.
            echo "- symbols: ${note}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      - name: Sign + stage APK
        shell: bash
        # A release build with no signing config emits an *unsigned* APK;
        # zipalign then debug-sign it with apksigner so it installs.
        run: |
          set -euo pipefail
          SRC=$(find crates/outl-mobile/src-tauri/gen/android/app/build/outputs/apk \
                  \( -name '*-release-unsigned.apk' -o -name '*-release.apk' \) | head -n1)
          if [[ -z "${SRC}" ]]; then
            echo "::error::no release APK produced (run produced:)"
            find crates/outl-mobile/src-tauri/gen/android/app/build/outputs -type f -print
            exit 1
          fi
          BT=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -n1)
          # `-P 16`, not `-p 4`. An uncompressed `.so` is mapped straight
          # out of the APK, so its offset has to land on a page boundary of
          # the device reading it, and 16 KB is a page size Android devices
          # already run. Needs build-tools 35+, which is
          # what the newest-installed pick above resolves to.
          "${BT}/zipalign" -f -P 16 4 "${SRC}" "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" sign \
            --ks "${RUNNER_TEMP}/debug.keystore" \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out outl-android-arm64.apk \
            "${RUNNER_TEMP}/aligned.apk"
          "${BT}/apksigner" verify outl-android-arm64.apk
          shasum -a 256 outl-android-arm64.apk > outl-android-arm64.apk.sha256

      - name: Check the APK loads where pages are 16 KB
        shell: bash
        # v0.12.0-beta.226 shipped an APK that crashed on open for anyone on a
        # 16 KB-page device: the Rust `.so` had 4 KB-aligned LOAD segments, so
        # `dlopen` refused it and `MainActivity.onCreate` died on its first
        # `System.loadLibrary`. Nothing went red, because the build and the
        # signature were both fine.
        #
        # The two steps that decide this are the linker flag in
        # `.cargo/config.toml` and the `zipalign` above, and each fails
        # silently. The finished APK is where both are visible at once, and it
        # also covers a library we do not build arriving through a dependency.
        run: python3 crates/outl-mobile/scripts/android-apk-page-alignment.py outl-android-arm64.apk

      # There is no `llvm-strip` step for Android because AGP already does it:
      # `gen/android/app/build.gradle.kts` keeps debug symbols for the debug
      # variant only (through `androidComponents`, not a `packaging` block
      # inside the build type, which Kotlin applies to every variant), so
      # Gradle's strip task runs on every `.so` on its way into the release
      # APK. It strips with the NDK that file's `ndkVersion` names, which has
      # to be the `NDK_VERSION` installed above: AGP falls back to its own
      # default NDK otherwise, finds none, and packages the library
      # unstripped with only a warning that `--quiet` Gradle never prints.
      #
      # Which makes the finished APK the only place that can confirm it. With
      # `[profile.release]` no longer stripping, the library Gradle is handed
      # now carries full debug info, and a `keepDebugSymbols` line added to
      # the wrong buildType — or an AGP default that changes — would ship it.
      # Nothing else in this job would notice.
      - name: Check the APK ships no debug info
        shell: bash
        run: python3 scripts/check-artifact-stripped.py outl-android-arm64.apk

      - name: Upload APK to draft release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Two decisions meet here and close the recovery path, so the step
        # has to name it. A release takes assets only while it is a draft
        # (header, failure mode 2), and this job is best-effort, so
        # `publish_release` flips the draft whether or not the APK landed.
        # "Re-run failed jobs" after an Android failure therefore arrives at
        # a published, immutable release and gets a bare `HTTP 422: Cannot
        # upload assets to an immutable release` — which reads like a token
        # scope problem and actually means "too late, cut a new beta".
        #
        # Same `isDraft` probe `create_release` already makes; that job owns
        # the check on a fresh run but does not re-run alongside this one.
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare.outputs.tag }}'
          IS_DRAFT=$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)
          if [[ "${IS_DRAFT}" != "true" ]]; then
            echo "::error::${TAG} is already published, and an immutable release accepts no new assets — re-running this job cannot attach the APK. Push again to cut a new beta that carries it."
            exit 1
          fi
          gh release upload "${TAG}" \
            outl-android-arm64.apk \
            outl-android-arm64.apk.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  screenshots:
    name: Release screenshots
    needs: [prepare, create_release]
    # Only for a version tag pushed by hand (GA), not the beta cut on
    # every push to main: those also get a tag, but `github.ref` is then
    # `refs/heads/main`. When skipped, `publish_release` still runs: it
    # carries `!cancelled()` and doesn't check this job's result.
    if: >-
      !cancelled() &&
      needs.create_release.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    # Best-effort, like `build_android`: listed in `publish_release.needs`
    # so the images land while the release is still a draft, but absent
    # from its conditions, so a broken shot never blocks a release.
    permissions:
      contents: write
    uses: ./.github/workflows/release-screenshots.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}

  publish_release:
    name: Publish release
    needs:
      [
        prepare,
        create_release,
        build,
        build_desktop,
        build_desktop_linux,
        build_desktop_windows,
        build_android,
        screenshots,
      ]
    # This used to read `needs.build.result == 'success'` for each build job,
    # which made every job a single point of failure for every other job's
    # assets: one architecture's bundler, or one flaky runner, and a release
    # with 25 finished artifacts published none of them. The repo's own
    # answer for `build_android` was the opposite extreme — absent from the
    # conditions, so a missing APK published in silence.
    #
    # Neither is what we want, and neither is a question about job *results*.
    # What matters is which assets are on the draft, so that is what the gate
    # reads: `scripts/release_assets.py` says which assets a release must
    # carry and which are still in bring-up, and the step below fails on a
    # missing required one and names a missing optional one in the release
    # notes. `!cancelled()` keeps this job evaluating even when an upstream
    # job failed, which is the whole point.
    if: >-
      !cancelled() &&
      needs.prepare.outputs.dry_run != 'true' &&
      needs.create_release.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read while it is still a draft: a published release is immutable, so
      # this is the last moment anything can be added to it, and the last
      # moment the notes can say what is not there.
      - name: Read the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets > assets.json
          echo "assets on the draft:"
          python3 -c "import json;[print(' -', a['name']) for a in json.load(open('assets.json'))['assets']]"

      - name: Gate on the required assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/check-release-assets.py \
            --draft assets.json --version "${VERSION}" --note-file gap.md

      # A gap the gate allowed still has to reach whoever downloads this
      # release, and the release body is the one place they are already
      # looking. `--generate-notes` wrote that body when the draft was
      # created, so this appends rather than replaces.
      - name: Say in the release notes what is missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! -s gap.md ]]; then
            echo "::notice::nothing missing; release notes unchanged"
            exit 0
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > body.md
          cat gap.md >> body.md
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file body.md
          cat gap.md >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Flip draft to published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
          echo "::notice::Published ${TAG}"

  update_tap:
    name: Bump the Homebrew + Scoop manifests
    needs: [prepare, publish_release]
    # Only beta releases for now. GA bumps `Formula/outl.rb` and the
    # GA cask by hand the first time; after that we can add a
    # similar job for GA.
    #
    # `!cancelled()` is here for the same reason `publish_release` carries
    # it, one level further down. A job's implicit `success()` reads the
    # whole ancestor tree, not just its direct `needs`, so a failed
    # `build_android` skipped this job even though `publish_release` had
    # already flipped the draft. Three releases shipped that way
    # (beta.207 among them) with the tap left on the previous version, so
    # `brew upgrade outl-beta` kept serving the old binary and no job went
    # red to say so. The explicit condition below is unchanged: this still
    # only runs on a release that actually got published.
    if: >-
      !cancelled() &&
      needs.publish_release.result == 'success' &&
      needs.prepare.outputs.prerelease == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download the digest sidecars
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # A bare `HTTP 500` on one asset killed the beta.202 bump and left
          # the tap a version behind, which is the same user-visible outcome
          # as the skip this job's `if` now guards against. `--clobber` so a
          # retry overwrites whatever the failed attempt already wrote.
          for attempt in 1 2 3; do
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --pattern '*.sha256' --dir shas --clobber; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::could not download the .sha256 sidecars from $TAG after 3 attempts"
              exit 1
            fi
            echo "::warning::release download attempt $attempt failed; retrying"
            sleep $(( attempt * 5 ))
          done
          # What arrived, as the asset list the gate below reads. The files
          # on disk are the thing that matters here: a manifest is bumped
          # from a digest, and a digest that did not download cannot bump
          # anything whatever the release API says it has.
          python3 -c "import json, os; print(json.dumps(sorted(os.listdir('shas'))))" > shas.json
          cat shas.json

      # Per manifest, all or nothing. A manifest carrying a new `version`
      # and a previous release's digest is a hash mismatch on install, which
      # is strictly worse than one still pointing at a release that exists —
      # so a manifest whose assets did not all land is left alone, loudly,
      # and the next release picks it up.
      - name: Decide which manifests may advance
        id: gate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail
          for tap in brew cask scoop; do
            if python3 scripts/check-release-assets.py \
                 --draft shas.json --version "${VERSION}" --tap "${tap}"; then
              echo "${tap}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${tap}=false" >> "$GITHUB_OUTPUT"
              echo "- ${tap}: NOT bumped, assets missing from ${{ needs.prepare.outputs.tag }}" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
          done

      - name: Bump Formula/outl-beta.rb
        if: steps.gate.outputs.brew == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          F=Formula/outl-beta.rb
          sed -i "s|^  version .*|  version \"$VERSION\"|" "$F"
          # One name per `build` matrix leg that Homebrew serves.
          # `scripts/check-release-assets.py --manifest` fails when this list
          # and `scripts/release_assets.py` disagree, because a leg added
          # without its name here bumps nothing and nothing goes red:
          # `git diff --quiet` below only sees that *something* changed.
          for arch in macos-arm64 macos-x64 linux-x64 linux-arm64; do
            sha=$(awk '{print $1}' "shas/outl-${arch}.tar.gz.sha256")
            sed -i "s|sha256 \"[a-f0-9]*\" # anchor: ${arch}|sha256 \"${sha}\" # anchor: ${arch}|" "$F"
          done

          # Bottle block: `root_url` points at this release's assets and
          # each tag carries the sha of its own `.bottle.tar.gz`. The
          # bottle tags are pinned to the oldest supported macOS (see the
          # `build` matrix) — Homebrew falls back from newer releases.
          sed -i \
            "s|^    root_url .*|    root_url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}\" # anchor: bottle-root-url|" \
            "$F"
          for pair in "macos-arm64:arm64_ventura" "macos-x64:ventura" "linux-x64:x86_64_linux" "linux-arm64:arm64_linux"; do
            arch="${pair%%:*}"
            tag="${pair##*:}"
            sha=$(awk '{print $1}' "shas/outl-beta-${VERSION}.${tag}.bottle.tar.gz.sha256")
            # `brew style` pads the digests into a column, so the run of
            # spaces after `<tag>:` is captured and put back verbatim —
            # digests are fixed-width, so alignment survives the bump.
            sed -i \
              "s|\(${tag}:[[:space:]]*\)\"[a-f0-9]*\" # anchor: bottle-${arch}|\1\"${sha}\" # anchor: bottle-${arch}|" \
              "$F"
          done

      - name: Bump Casks/outl-desktop-beta.rb
        if: steps.gate.outputs.cask == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          C=Casks/outl-desktop-beta.rb
          sed -i "s|^  version .*|  version \"$VERSION\"|" "$C"
          # Single universal dmg → one anchor (`# anchor: macos`).
          # Previously we patched separate arm64/x64 anchors; the
          # cask file collapsed when we moved to `--target
          # universal-apple-darwin`.
          sha=$(awk '{print $1}' "shas/outl-desktop-macos.dmg.sha256")
          sed -i "s|sha256 \"[a-f0-9]\{64\}\" # anchor: macos|sha256 \"${sha}\" # anchor: macos|" "$C"

      - name: Bump bucket/outl-beta.json
        if: steps.gate.outputs.scoop == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # `jq`, not `sed`: the manifest is JSON, so there is a parser for
          # it and no anchor comments are needed. The urls carry `$version`
          # and Scoop substitutes it, so only the version and the two
          # digests move.
          B=bucket/outl-beta.json
          X64=$(awk '{print $1}' shas/outl-windows-x64.zip.sha256)
          ARM64=$(awk '{print $1}' shas/outl-windows-arm64.zip.sha256)
          jq --arg v "$VERSION" --arg x64 "$X64" --arg arm64 "$ARM64" \
            '.version = $v
             | .architecture["64bit"].hash = $x64
             | .architecture["arm64"].hash = $arm64' \
            "$B" > "$B.tmp"
          mv "$B.tmp" "$B"
          python3 -c "import json;json.load(open('$B'))"

      - name: Commit whatever moved
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          FILES=(Formula/outl-beta.rb Casks/outl-desktop-beta.rb bucket/outl-beta.json)
          if git diff --quiet "${FILES[@]}"; then
            echo "::notice::No manifest changes for $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          # `[skip ci]` keeps this commit from re-triggering the release
          # workflow (which is `on: push: branches: [main]`).
          git commit -m "packaging: outl ${VERSION} [skip ci]"
          git push origin HEAD:main

  publish_npm:
    name: Publish @outl/plugin-sdk to npm
    needs: prepare
    # `@outl/plugin-sdk` is types-only: zero runtime deps, no build step — it
    # ships the raw `src/` TypeScript (see plugin-sdk/package.json `files`).
    # It's independent of the Rust / desktop / mobile binaries, so it only
    # waits on `prepare` (the version) and never blocks on a slow platform
    # build — nor does a broken platform build block the SDK.
    #
    # Version tracks the release exactly, same as the binaries:
    #   push main  -> <base>-beta.<run_number>   (prerelease)
    #   tag vX.Y.Z -> X.Y.Z                       (GA)
    # Both publish under the `latest` dist-tag, so `npm i @outl/plugin-sdk`
    # always resolves the newest build cut from main.
    #
    # Auth is npm trusted publishing (OIDC), not a stored token. npm caps a
    # write token at 90 days. The `NPM_TOKEN` in the `release` environment
    # was stored on 2026-07-16 and every publish from 2026-10-14 on answered
    # E404 on the PUT, which is how npm says "this credential can't write
    # here". A fresh repo-level `NPM_TOKEN` didn't help either: an
    # environment secret shadows a repo secret of the same name. With
    # OIDC each run gets a short-lived token minted for this exact workflow,
    # so there is nothing to rotate, and npm attaches provenance on its own.
    #
    # The trust is configured on npmjs.com (package → Settings → Trusted
    # publishing) and must match exactly: owner `outlmd`, repo `outl`,
    # workflow `release.yml`, environment `release`, publish allowed.
    #
    # Two constraints follow from it:
    # - GitHub-hosted runner. npm doesn't accept OIDC from self-hosted
    #   runners yet, and Blacksmith runners are self-hosted to GitHub. The
    #   job is a two-second `npm publish`, so the runner choice costs nothing.
    # - npm >= 11.5.1 (Node 24 ships it). Older npm ignores OIDC and fails
    #   with ENEEDAUTH.
    if: needs.prepare.result == 'success' && needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    # Keeps the environment's protection rules on the publish; the trusted
    # publisher entry on npmjs.com names this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm exchanges for a publish token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build commit itself — not the tag, which the parallel `tag`
          # job may not have pushed yet on a main-push run.
          ref: ${{ github.sha }}
          persist-credentials: false

      # No `registry-url`: that input writes an `.npmrc` expecting
      # NODE_AUTH_TOKEN, and there is no token anymore. The default registry
      # is already registry.npmjs.org.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # never restore a cache into a publish

      - name: Publish (idempotent)
        working-directory: plugin-sdk
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Fail loud on an npm that predates OIDC instead of the bare
          # ENEEDAUTH it would print otherwise.
          NPM_VERSION=$(npm --version)
          echo "npm ${NPM_VERSION}"
          if [ "$(printf '%s\n' 11.5.1 "${NPM_VERSION}" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm ${NPM_VERSION} can't use trusted publishing; need >= 11.5.1"
            exit 1
          fi
          # A re-run — or a retried beta run_number — may target a version
          # already on npm. Republishing the same version is a hard error,
          # so skip when it's already there (also the clean no-op path when
          # nothing changed). `npm view` fails on a never-published package
          # (first release), which the `|| true`-free `if` treats as "absent".
          if npm view "@outl/plugin-sdk@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@outl/plugin-sdk@${VERSION} already on npm; skipping."
            exit 0
          fi
          # Stamp the release version into package.json in place — no git
          # commit/tag, same throwaway-patch approach the binaries use for
          # Cargo.toml. The repo keeps its own version untouched.
          #
          # `--no-workspaces` is load-bearing: the repo root is a bun workspace
          # whose siblings (examples/*, outl-desktop) declare `workspace:*`
          # deps, a protocol npm can't resolve. Without the flag, npm runs
          # these commands workspace-aware, walks up to the root, tries to
          # build the whole monorepo tree, and dies with EUNSUPPORTEDPROTOCOL
          # on `workspace:*` — even though the SDK itself has zero deps. On a
          # clean CI checkout (no node_modules to short-circuit resolution)
          # this is a hard failure.
          npm version "${VERSION}" --no-git-tag-version --allow-same-version --no-workspaces
          # Scoped package: `--access public` (the first publish would else
          # default to a private, paid publish). `latest` keeps main the
          # default `npm install` resolves.
          npm publish --access public --tag latest --no-workspaces
          echo "::notice::Published @outl/plugin-sdk@${VERSION}"

  publish_crates:
    name: Publish lib crates to crates.io
    needs: prepare
    # Same philosophy as `publish_npm` above: waits only on `prepare` (the
    # version) and never blocks on a slow platform build. `cargo publish`
    # verifies each crate by building it, so a broken commit fails here on
    # its own — the job is self-gating.
    #
    # Version tracks the release exactly, same as the binaries:
    #   push main  -> <base>-beta.<run_number>   (prerelease)
    #   tag vX.Y.Z -> X.Y.Z                       (GA)
    # SemVer keeps consumers safe: a plain `outl-core = "0.8"` requirement
    # never resolves a `-beta.N` prerelease. Embedders that want to ride
    # main opt in with a `"0.8.0-beta"`-style requirement.
    #
    # Only the embedder closure publishes (`outl-ws` -> `outl-actions` ->
    # {`outl-core`, `outl-md`, `outl-exec`}); every other crate carries
    # `publish = false` in its manifest.
    if: needs.prepare.result == 'success' && needs.prepare.outputs.dry_run != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # `CARGO_REGISTRY_TOKEN` lives in the `release` environment.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build commit itself — not the tag, which the parallel `tag`
          # job may not have pushed yet on a main-push run.
          ref: ${{ github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Patch workspace version to ${{ needs.prepare.outputs.version }}
        shell: bash
        # Same throwaway sed pass as the build jobs: rewrites every literal
        # `version = "<base>"` in the root manifest — `workspace.package`
        # AND the internal `workspace.dependencies` entries — so the
        # published crates depend on each other at the exact release
        # version. Crate manifests inherit and need no patching.
        run: |
          BASE='${{ needs.prepare.outputs.base }}'
          VERSION='${{ needs.prepare.outputs.version }}'
          sed -i.bak "s|version = \"${BASE}\"|version = \"${VERSION}\"|g" Cargo.toml
          rm Cargo.toml.bak

      - name: Publish (idempotent, dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        # One `-p` at a time in dependency order — cargo waits for each
        # publish to land in the sparse index before the next crate's
        # verify build resolves it. The crates.io pre-check makes re-runs
        # safe: a published version is immutable and republishing is a
        # hard error, so a half-published run resumes where it stopped
        # instead of dying on the crate that already made it.
        run: |
          set -euo pipefail
          for crate in outl-core outl-md outl-exec outl-actions outl-ws; do
            if curl -fsSL "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null 2>&1; then
              echo "::notice::${crate}@${VERSION} already on crates.io; skipping."
              continue
            fi
            cargo publish -p "${crate}" --allow-dirty
          done
