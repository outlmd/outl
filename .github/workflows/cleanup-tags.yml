name: Cleanup beta tags

# Every push to `main` produces a beta tag + GitHub Release via
# `release.yml`. Left alone, that bucket grows by one item per merge.
# This workflow keeps only the two most recently generated betas in
# the whole repo, and deletes every older one.
#
# It runs after every `Release` on `main`, and is also exposed as
# `workflow_dispatch` with an opt-in `dry_run` flag so we can preview
# what would be pruned before letting it act.
#
# What is and is not a prune candidate lives with the code that decides
# it, in `.github/scripts/cleanup_beta_tags.sh`. This file only says
# when that script runs.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, but don't delete"
        type: boolean
        default: false
      keep:
        description: "How many of the newest betas to keep, repo-wide"
        type: string
        default: "2"

permissions:
  contents: write

concurrency:
  # Queue, never cancel. The prune is idempotent, so cancelling used to
  # look free: the next run recomputes the list from scratch. But a
  # burst of merges then cancels every cleanup before it finishes its
  # delete loop, and "the next one will finish the job" is only true if
  # a next one ever gets to run to completion. That is the same shape as
  # the bug below: a prune that silently never happens. Steady state is
  # one deletion per run, so a queued run costs seconds.
  group: cleanup-tags
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune beta tags
    # Deliberately does NOT gate on `workflow_run.conclusion`.
    #
    # `Release` concludes `failure` whenever ANY of its ~21 jobs fails,
    # including jobs that say nothing about whether a release landed
    # (`Publish @outl/plugin-sdk to npm` has been red since 2026-11-02
    # while every beta published fine). Gating on it skipped this job on
    # 25 consecutive runs, and the beta bucket reached 101 tags while the
    # script that was supposed to cap it at 2 sat there, correct and
    # never executed.
    #
    # That is the mistake `publish_release` already avoids: ask what is
    # actually on the repo, not whether the workflow went green. The
    # script asks it directly, off the live tag list, so a Release that
    # published nothing leaves it a no-op. What this gate used to cover
    # by accident is now covered on purpose, by the script's manifest
    # guard.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute prune list and delete
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          KEEP: ${{ github.event.inputs.keep || '2' }}
        run: .github/scripts/cleanup_beta_tags.sh
