name: Cleanup beta tags

# Every push to `main` produces a beta tag + GitHub Release via
# `release.yml`. Left alone, that bucket grows by one item per merge.
# This workflow keeps only the two most recently generated betas in
# the whole repo, and deletes every older one.
#
# It runs once per tag, called from `release.yml`, and is also exposed
# as `workflow_dispatch` with an opt-in `dry_run` flag so we can preview
# what would be pruned before letting it act. Use the dispatch for a
# large catch-up drain: it is outside `release.yml`'s concurrency group,
# so a merge landing mid-drain will not cancel it.
#
# What is and is not a prune candidate lives with the code that decides
# it, in `.github/scripts/cleanup_beta_tags.sh`. This file only says
# when that script runs.

on:
  # Called by `release.yml` from `needs: tag`, so the prune happens when
  # the tag lands rather than when the whole workflow finishes, 9 to 34
  # min later across recent runs. `tag` only runs on
  # `create_tag == 'true'`, and a dry run forces that false, so reaching
  # the call means a tag really exists.
  #
  # NOT `on: push: tags:`. `release.yml` pushes the beta tag with
  # `GITHUB_TOKEN`, and a ref pushed by that token does not trigger
  # workflows. `docker.yml` has declared `tags: ["v*"]` for months and
  # has zero tag-triggered runs across ~100 pushed beta tags, which is
  # what that looks like from the outside: nothing, silently.
  workflow_call:
    inputs:
      dry_run:
        description: "List what would be deleted, but don't delete"
        type: boolean
        default: false
      keep:
        description: "How many of the newest betas to keep, repo-wide"
        type: string
        default: "2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted, but don't delete"
        type: boolean
        default: false
      keep:
        description: "How many of the newest betas to keep, repo-wide"
        type: string
        default: "2"

permissions:
  contents: write

concurrency:
  # Queue, never cancel. The prune is idempotent, so cancelling looked
  # free: the next run recomputes the list from scratch. But "the next
  # one will finish the job" is only true if a next one ever runs to
  # completion, which is the same shape as the bug documented on the job
  # below. Steady state is one deletion, so a queued run costs seconds.
  #
  # This only stops two prunes from racing each other. As a called job
  # it still dies with its caller, and `release.yml` cancels in progress
  # per ref, so a merge landing mid-prune takes it down. That is fine for
  # one deletion and not fine for a 99-tag drain, which is what the
  # `workflow_dispatch` path is for.
  group: cleanup-tags
  cancel-in-progress: false

jobs:
  cleanup:
    name: Prune beta tags
    # No gate on how the caller's other jobs went, deliberately.
    #
    # This used to be a `workflow_run` listener gated on
    # `Release` concluding `success`, and `docs/android-platform.md`
    # argued for it: a red Android build skips the prune, but the prune
    # recomputes from scratch, so the next green release catches up.
    #
    # The premise was that a next green release exists. `Release`
    # concludes `failure` when ANY of its ~21 jobs fails, and
    # `publish_npm` plus `publish_crates` have failed on essentially
    # every run since 2026-10-19 while the betas themselves tagged and
    # published fine. The last `Release` to conclude `success` was
    # 2026-10-20; the 30 runs after it are 16 failures and 14
    # cancellations. So the gate held shut on 25 consecutive runs and
    # the bucket reached 101 tags, with the script meant to cap it at 2
    # sitting here correct and never run.
    # Self-healing that needs a green run is not self-healing in a repo
    # that has not had one in a week.
    #
    # Being called from `needs: tag` removes the question instead of
    # re-answering it: the caller cannot reach the call unless the tag
    # landed, and nothing about a later build failure is consulted. What
    # the old gate covered by accident, a Release that tagged but died
    # before bumping the package manifests, is covered on purpose now by
    # the script's manifest guard.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute prune list and delete
        env:
          GH_TOKEN: ${{ github.token }}
          # `inputs` is populated for both `workflow_call` and
          # `workflow_dispatch`, and both declare defaults, so no
          # `|| 'false'` fallback is needed here.
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP: ${{ inputs.keep }}
        run: .github/scripts/cleanup_beta_tags.sh
