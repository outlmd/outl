name: Desktop

# Builds the `outl-desktop` Tauri 2 application for macOS, Linux and
# Windows. PRs touching the desktop crate or any of its workspace
# dependencies run a check + build matrix to catch regressions
# early. The release path (signed artefacts, Homebrew cask) lives in
# `release.yml` and tags the resulting binaries off of a tag push —
# this workflow is the "does it still compile and bundle on every
# OS?" guard.
#
# Two jobs split by what's actually platform-specific:
#
#   `check`  → runs on Linux (cheapest runner). Owns clippy, rust
#              tests, Vitest, tsc, and a debug-profile `tauri build`
#              for Linux. Everything platform-agnostic happens here
#              once instead of four times.
#   `build`  → matrix of macOS arm64 / macOS x86_64 / Windows x86_64.
#              Compiles the Tauri app on the dev profile. We don't
#              repeat clippy/tests/vitest/tsc here because they don't
#              care which OS they're on.
#
# Both jobs build with `tauri build --debug` (dev profile) on purpose:
# this is a "does it still compile + assemble?" guard, and the dev
# profile is several times faster than the optimised release profile
# (no LTO, codegen-units > 1). Neither job uploads artefacts. The
# optimised, signed dmg/msi come from `release.yml`, gated on tag
# pushes — that's the only place the release profile is paid for.

on:
  push:
    branches: [main]
    paths:
      - "crates/outl-desktop/**"
      - "crates/outl-frontend-shared/**"
      - "crates/outl-actions/**"
      - "crates/outl-core/**"
      - "crates/outl-md/**"
      - "crates/outl-exec/**"
      # Catalogs the TS side mirrors: `shortcuts.support.test.ts` pins the
      # desktop handler map against `outl_shortcuts::support` (invariant 12)
      # and the theme suites pin token names against `outl_theme::Palette`
      # (invariant 13). Editing a catalog without these listed left both
      # parity gates unrun on the change that could break them.
      - "crates/outl-shortcuts/**"
      - "crates/outl-theme/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/outl-desktop/**"
      - "crates/outl-frontend-shared/**"
      - "crates/outl-actions/**"
      - "crates/outl-core/**"
      - "crates/outl-md/**"
      - "crates/outl-exec/**"
      # Catalogs the TS side mirrors: `shortcuts.support.test.ts` pins the
      # desktop handler map against `outl_shortcuts::support` (invariant 12)
      # and the theme suites pin token names against `outl_theme::Palette`
      # (invariant 13). Editing a catalog without these listed left both
      # parity gates unrun on the change that could break them.
      - "crates/outl-shortcuts/**"
      - "crates/outl-theme/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

# Cancel an in-flight run when a new push lands on the same branch —
# the bundle for the older commit is no longer interesting.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux x86_64
    runs-on: blacksmith-8vcpu-ubuntu-2204
    # `cargo test -p outl-desktop` links the desktop's test binaries with
    # tauri + webkit + wasmtime + iroh all in one image; since wasmtime 46
    # that link used to peak past the GitHub runner's ~7 GB RAM and the OOM
    # killer reaped the job (clippy compiles fine — only `cargo test` links
    # the fat binaries, so it died with no test output). That ceiling is
    # gone: `blacksmith-8vcpu-ubuntu-2204` has 32 GB, and the measured peak
    # on the 16 GB 4 vCPU SKU was 3.7 GB with zero OOM events. `debuginfo=0`
    # stays anyway — it is now a link-time and target-dir-size optimisation,
    # not a survival hack. 8 vCPU because the job ran at 74% average CPU on
    # 4 vCPU and it is the longest job in the pipeline. The whole job builds
    # on the dev profile (tests, clippy, and `tauri build --debug` share one
    # unoptimised artefact set instead of compiling the workspace twice as
    # dev + release), so there's no `CARGO_PROFILE_RELEASE_*` override to make
    # here. The optimised, stripped release build lives in release.yml, gated
    # on tag pushes.
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `setup-bun` caches the bun binary, not the packages it
      # downloads. On Blacksmith `actions/cache` is transparently
      # redirected to the colocated cache, so this restores at
      # ~400MB/s.
      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # Tauri 2 deps. Even the platform-agnostic checks (clippy,
      # `cargo test`) need outl-desktop to compile first, and that
      # depends on webkit2gtk-4.1 + libsoup-3 + libappindicator
      # being present.
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-Linux x86_64

      - name: Install frontend dependencies
        run: bun install

      # ── Platform-agnostic checks: clippy, rust tests, Vitest, tsc
      # all produce identical results on macOS / Linux / Windows, so
      # we run them once here instead of four times in the matrix.

      - name: Clippy
        run: cargo clippy -p outl-desktop --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test -p outl-desktop

      - name: Frontend tests
        run: bun --filter outl-desktop test

      - name: Type-check frontend
        working-directory: crates/outl-desktop
        run: bunx tsc --noEmit

      # ── Platform-specific: compile + assemble the Linux app. Mirrors
      # what the `build` matrix below does for macOS + Windows. `tauri
      # build` compiles the Rust binary itself, so there's no separate
      # `cargo build` step — that only duplicated the link. `--debug`
      # uses the dev profile (fast, unoptimised); `--no-bundle` (a
      # tauri-cli flag, before any `--`) skips the dmg/AppImage/msi
      # packagers we don't sign on PRs. The signed, optimised artefacts
      # come from release.yml on tag pushes.
      - name: Tauri build (debug, no bundle)
        working-directory: crates/outl-desktop
        run: bun run tauri build --debug --no-bundle

  build:
    name: ${{ matrix.label }}
    # Gate the expensive runners (macOS is 6.67x, Windows 2x Linux billing)
    # behind the Linux `check` job. `check` already compiles the whole
    # desktop tree + runs clippy/tests/tsc/vitest, so any compile error or
    # desktop test failure stops the matrix before a single macOS/Windows
    # minute is spent. A `needs` dep runs the dependent only on success, so
    # this is the gate — no extra `if:` required.
    needs: check
    runs-on: ${{ matrix.os }}
    # `tauri build --debug` uses the dev profile; `debuginfo=0` keeps the
    # link cheap and the target dir small on every OS. The optimised
    # release profile is paid for only on tag pushes, in release.yml.
    env:
      RUSTFLAGS: "-C debuginfo=0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-6vcpu-macos-15
            label: macOS arm64
            rust_target: aarch64-apple-darwin
          - os: blacksmith-4vcpu-windows-2025
            label: Windows x86_64
            rust_target: x86_64-pc-windows-msvc
          # macOS x86_64 is **not** in the PR matrix on purpose.
          # The Intel macOS pools are consistently depleted (jobs sit
          # queued for hours, sometimes overnight), so we don't block
          # PRs on a target we can't reliably schedule.
          # `release.yml::build_desktop` still produces a working
          # macOS x86_64 binary via `--target universal-apple-darwin`,
          # which builds both arches on a single arm64 runner and
          # lipo-merges them into one dmg.
          #
          # Both surfaces run on Blacksmith: Apple Silicon M4 for
          # macOS (6 vCPU is the smallest tier offered) and Windows
          # Server 2025 for Windows. The Windows image ships VS Build
          # Tools 2022 rather than the full Visual Studio IDE, which
          # is all `x86_64-pc-windows-msvc` needs to link.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.label }}

      - name: Install frontend dependencies
        run: bun install

      # `tauri build` compiles the Rust binary itself — no separate
      # `cargo build` step, which only duplicated the link. `--debug`
      # = dev profile (fast); `--no-bundle` skips the packagers.
      # release.yml drops both flags and ships the signed dmg/msi.
      - name: Tauri build (debug, no bundle)
        working-directory: crates/outl-desktop
        run: bun run tauri build --debug --no-bundle
