name: Set up a Tauri build
description: >
  The setup steps that are identical in every job that compiles a Tauri
  client: the Linux system libraries Tauri links against, Bun, the Bun
  package cache, and the frontend install.

# Why this exists.
#
# `desktop.yml` and `release.yml` each carried their own copy of the
# `apt-get install` list, byte for byte. A Tauri upgrade that needs one
# more `-dev` package would be added to whichever file the author was
# looking at, and the other one breaks. `desktop.yml` breaks on the next
# PR, which is fine. `release.yml` breaks in the nightly, hours later,
# after the change already looked green.
#
# This is a composite action rather than a reusable workflow on purpose.
# A reusable workflow is a whole job with its own runner and checkout, so
# it cannot contribute steps to a job that then goes on to build and
# upload. These are steps, so they belong in an action.
#
# Deliberately NOT in here:
# - the Rust toolchain. Three callers install it three different ways (a
#   `dtolnay/rust-toolchain` with `targets:`, and two raw `rustup target
#   add` scripts for the universal macOS and Windows cross builds).
#   Flattening that is a behaviour change per platform, not a dedup.
# - the cargo cache. `release.yml` uses `actions/cache` with an explicit
#   `path`/`key`, `desktop.yml` uses `Swatinem/rust-cache` with a
#   `shared-key`. They should agree, and picking one means one cold build
#   per job plus a build-time measurement nobody has taken yet. It is a
#   real finding, and its own change.
# - the build itself. `desktop.yml` runs a debug `--no-bundle` compile to
#   answer "does it build"; `release.yml` bundles, signs, strips, verifies
#   and uploads. Those are different jobs that happen to share a prologue.

inputs:
  linux-deps:
    description: >
      Install the Linux system libraries Tauri needs (webkit2gtk-4.1,
      libsoup-3, libappindicator, librsvg, patchelf). Pass "true" only on
      a Linux runner; `apt-get` is what reports the mistake otherwise, and
      it reports it immediately rather than as a missing library halfway
      through a build.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Tauri 2 deps. Even the platform-agnostic checks (clippy,
    # `cargo test`) need outl-desktop to compile first, and that
    # depends on webkit2gtk-4.1 + libsoup-3 + libappindicator
    # being present.
    - name: Linux build dependencies
      if: inputs.linux-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          patchelf

    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: latest

    # `setup-bun` caches the bun binary, not the packages it downloads.
    # On Blacksmith `actions/cache` is transparently redirected to the
    # colocated cache, so this restores at ~400MB/s. A miss costs a
    # normal `bun install`, so there is nothing to get wrong here.
    - name: Cache bun install cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    # Repo root: the root `package.json` is the bun workspace, and every
    # client resolves its deps through it.
    - name: Install frontend dependencies
      shell: bash
      run: bun install
