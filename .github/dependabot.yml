version: 2
updates:
  # Every action is pinned to a commit SHA with the release tag in a
  # comment. Dependabot moves both together, one PR a week.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # One Cargo workspace at the root (Cargo.lock). The toolchain is
  # pinned in rust-toolchain.toml, so a bump that needs a newer rustc
  # fails CI here instead of on main.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # The five RustPython ruff forks are pinned with `=0.16.5` in
    # crates/outl-exec/Cargo.toml (see the comment there): rustpython 0.6.0
    # is built against that version and must move as one family. A bump of
    # any of them alone breaks the build (#507), so lift these ignores
    # together with the pins.
    ignore:
      - dependency-name: "rustpython-ruff_python_ast"
      - dependency-name: "rustpython-ruff_python_parser"
      - dependency-name: "rustpython-ruff_python_trivia"
      - dependency-name: "rustpython-ruff_source_file"
      - dependency-name: "rustpython-ruff_text_size"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # Bun workspace at the root (bun.lock). Only versions written directly
  # in a manifest are updated: Dependabot's bun backend skips `catalog:`
  # requirements (dependabot-core#14320), so the shared versions in
  # package.json `workspaces.catalog` (TypeScript, Vite, Vitest, Solid,
  # Tailwind, Tauri) still need a manual bump until that lands.
  # Workspace members, including crates/outl-mobile, resolve from this lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-minor-patch:
        update-types: ["minor", "patch"]
