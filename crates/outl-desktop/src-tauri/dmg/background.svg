<?xml version="1.0" encoding="UTF-8"?>
<!--
  Source of truth for the macOS .dmg install-window background.

  Colours are outl-theme's `outl` (brand, dark) preset, nothing else:
    bg          #0c0814   canvas, arrow, card rim
    bg_elev     #15101f   canvas gradient top
    fg          #f4f1fa   wordmark, card sheen
    accent      #a78bfa   ambient glow, and the card fill below

  The card fill #7d68bc is `accent` composited at 73% over `bg` — the same
  "translucent chrome over the canvas" move DESIGN.md already uses for the
  fg/10 chrome layer, not a new brand colour. 73% is not a taste decision:
  the Finder icon labels ("outl", "Applications") are drawn by macOS in the
  system label colour, which flips with the system appearance, and that card
  is what sits under both of them. Relative luminance 0.179 is the crossover
  where near-black and near-white text score the same, so the fill is tuned
  to land there: 4.58:1 against black (Light appearance) and 4.59:1 against
  white (Dark appearance). Both clear WCAG AA, in both appearances, which no
  darker or lighter fill can do.

  Keep y 240..338 of the card flat #7d68bc. The sheen gradient dies at the
  card's midpoint on purpose — anything that lightens or darkens the strip
  where the labels sit breaks the number above, and the labels land anywhere
  in y 277..314 depending on whether Finder reads its item position as the
  icon's centre or the icon-plus-label cell's.

  Render (see tauri.conf.json for where the output is wired), from this
  directory, passing the flags after a bare "nix run nixpkgs#resvg":
    background.svg background.png  -w 660

  One size, deliberately. tauri-bundler copies the single `background` file
  verbatim into the dmg and has no @2x or tiffutil path, so a retina master
  would be a file nothing consumes. The Finder draws this 1x file at 1 pixel
  per point, which a retina display then paints at 2x, so the art is flat
  shapes and thick strokes to survive that.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15101f"/>
      <stop offset="1" stop-color="#0c0814"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.62">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sheen" x1="0" y1="122" x2="0" y2="338" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f1fa" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#f4f1fa" stop-opacity="0"/>
    </linearGradient>

    <filter id="cardshadow" x="-8%" y="-14%" width="116%" height="134%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- canvas -->
  <rect width="660" height="400" fill="url(#canvas)"/>
  <rect width="660" height="400" fill="url(#glow)"/>

  <!-- drop surface: both icons and both Finder labels land on this -->
  <rect x="40" y="122" width="580" height="216" rx="28" fill="#7d68bc" filter="url(#cardshadow)"/>
  <rect x="40" y="122" width="580" height="216" rx="28" fill="url(#sheen)"/>
  <rect x="40.75" y="122.75" width="578.5" height="214.5" rx="27.25"
        fill="none" stroke="#0c0814" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- drag affordance: app icon (x 165) -> Applications alias (x 495) -->
  <g fill="none" stroke="#0c0814" stroke-opacity="0.92" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M266 216 H372"/>
    <path d="M360 196 L392 216 L360 236"/>
  </g>

  <!-- brand lockup: the logo as shipped, then the wordmark.
       The mark is assets/logo.png itself, referenced rather than copied, so
       there is still one owner of the logo; only the rendered .png ships.
       The wordmark is drawn as strokes, not type, so the asset carries no
       font dependency and renders identically on any machine. -->
  <image href="../../../../assets/logo.png" x="221" y="27" width="64" height="64"/>
  <g fill="none" stroke="#f4f1fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="321" cy="68" r="12"/>
    <path d="M349 56 L349 70 A10 10 0 0 0 369 70 L369 56"/>
    <path d="M395 38 L395 68 A12 12 0 0 0 407 80"/>
    <path d="M385 54 H407"/>
    <path d="M423 38 L423 68 A12 12 0 0 0 435 80"/>
  </g>
</svg>
