[package]
name = "outl-desktop"
description = "Desktop client for outl (Tauri 2 + Solid, macOS/Linux/Windows)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "outl_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = { workspace = true }

[dependencies]
outl-core = { workspace = true }
outl-md = { workspace = true }
outl-actions = { workspace = true }
outl-config = { workspace = true }
outl-exec = { workspace = true, default-features = true }
outl-plugins = { workspace = true, features = ["registry"] }
outl-shortcuts = { workspace = true }
outl-tauri-shared = { workspace = true }
outl-theme = { workspace = true }
# Crash reporting (RFC 0377). The dependency is unconditional; the *reporter*
# is not. `outl-telemetry`'s own `sentry` feature is what links the SDK, and it
# is off by default, so a build nobody passed `--features sentry` to contains
# no reporter to switch on — that is condition 1, and it is why someone who
# clones this repo and runs it has no Sentry in the binary at all.
outl-telemetry = { workspace = true }
outl-sync-iroh = { workspace = true }
dirs = { workspace = true }
# Pin the rustls crypto provider. iroh pulls rustls with default features off,
# dropping the workspace-wide default provider, which makes reqwest (Tauri's
# webview asset protocol) panic at boot. `run()` installs `ring` explicitly.
rustls = { workspace = true }

tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
log = { workspace = true }
tauri-plugin-dialog = "2"
# Backend clipboard read for "paste without formatting" (Cmd+Shift+V).
# `navigator.clipboard.readText()` in the macOS WKWebview pops the native
# "Paste" permission button when called outside a paste gesture, so the
# chord surfaced a "paste" prompt and inserted nothing. Reading via the
# plugin (backend `arboard`) bypasses that gate.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
# `outl://` deep links (Raycast "open in app", shared launchers). The
# single-instance plugin's `deep-link` feature forwards the URL to the
# already-running instance on Linux/Windows (macOS routes it natively).
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
notify = "8"
notify-debouncer-full = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
ulid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
# Installs an stderr log subscriber at boot so the iroh transport's
# info!/warn!/debug! lines are visible in the terminal running the app.
tracing-subscriber = { workspace = true }
yrs = { workspace = true }
anyhow = { workspace = true }
tauri-plugin-notification = "2"
# OS-wide quick capture chord (Cmd/Ctrl+Shift+Space) while outl is in the background.
tauri-plugin-global-shortcut = "2"

[features]
default = []
# Links the Sentry SDK. Set only by the release pipeline. Leave it off and
# `outl_telemetry::init` is a function that returns `None`.
sentry = ["outl-telemetry/sentry"]
