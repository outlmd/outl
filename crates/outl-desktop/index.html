<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0814" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>outl</title>
    <style>
      /*
       * Boot frame painted before Vite's CSS bundle loads. The
       * var() fallbacks mirror the `outl` brand defaults from
       * styles.css so the user never sees a flash of white.
       *
       * IMPORTANT: this rule is *unlayered*, so in the cascade it
       * beats everything styles.css declares inside `@layer base`.
       * It MUST read the `--color-outl-*` custom properties (which
       * applyPaletteToRoot() installs inline on <html>) instead of
       * hardcoding hex values — a hardcoded background here
       * permanently overrides every light theme and the app stays
       * dark no matter which preset the user picks.
       */
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background-color: var(--color-outl-bg, #0c0814);
        color: var(--color-outl-fg, #f4f1fa);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "SF Pro Text",
          system-ui, sans-serif;
      }
    </style>
    <script>
      /*
       * The user's palette, on the FIRST frame.
       *
       * The real palette arrives over IPC — `get_settings` then
       * `get_theme` ×2 — which is two round-trips after this document
       * parses. Until then the rule above falls back to the brand's dark
       * `#0c0814`, so every light-theme user saw a dark flash on every
       * launch, and a dark-theme user on a light OS saw the reverse once
       * `color-scheme` landed.
       *
       * So the last installed palette is replayed here, before anything
       * paints. `applyPaletteToRoot` (@outl/shared/theme) is the only
       * writer of that cache and the only owner of what a palette means;
       * this script knows nothing about colours — it assigns one string
       * to one element.
       *
       * Deliberately inline and deliberately not a module: a module is
       * deferred until after the document parses, which is exactly the
       * frame this exists to fix. Wrapped in try/catch because
       * `localStorage` throws with site data blocked, and a theme cache
       * must never be able to stop the app from booting.
       */
      try {
        var cached = localStorage.getItem("outl.boot.style");
        if (cached) document.documentElement.style.cssText = cached;
      } catch (e) {
        /* No cache: the static rule above paints the brand default. */
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
