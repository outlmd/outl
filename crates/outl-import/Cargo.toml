[package]
name = "outl-import"
description = "Adapter-based graph importers (Roam, Logseq, Obsidian) targeting an outl workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
outl-core = { workspace = true }
outl-md = { workspace = true }
outl-actions = { workspace = true }

serde = { workspace = true }
walkdir = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Remote asset download (Roam firebase-hosted images). rustls only —
# never OpenSSL. Blocking client: the import pipeline is synchronous.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
] }

[dev-dependencies]
tempfile = { workspace = true }
