name: outl-mobile
options:
  bundleIdPrefix: app.outl.mobile-app
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
# Mirrors the pbxproj's baseConfigurationReference. Project level, so the
# three targets inherit the flavor variables; see Outl.xcconfig.
configFiles:
  debug: Outl.xcconfig
  release: Outl.xcconfig
settingGroups:
  app:
    base:
      PRODUCT_NAME: outl
      PRODUCT_BUNDLE_IDENTIFIER: $(OUTL_BUNDLE_ID)
      MARKETING_VERSION: 0.3.1
      CURRENT_PROJECT_VERSION: 1
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
      INFOPLIST_KEY_CFBundleDisplayName: $(OUTL_DISPLAY_NAME)
      ENABLE_USER_SCRIPT_SANDBOXING: NO
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
# The committed project.pbxproj is the source of truth for builds;
# this file mirrors it for `xcodegen`. The extension targets below were
# added to the pbxproj by `scripts/ios-add-extension.py` (RFC 0363).
packages:
  OutlKit:
    path: ../../../swift/OutlKit
targets:
  OutlWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [OutlWidget]
    info:
      path: OutlWidget/Info.plist
    entitlements:
      path: OutlWidget/OutlWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OUTL_BUNDLE_ID).widget
        CODE_SIGN_IDENTITY: Apple Development
    dependencies:
      - package: OutlKit
  OutlShare:
    type: app-extension
    platform: iOS
    sources: [OutlShare]
    info:
      path: OutlShare/Info.plist
    entitlements:
      path: OutlShare/OutlShare.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OUTL_BUNDLE_ID).share
        CODE_SIGN_IDENTITY: Apple Development
    dependencies:
      - package: OutlKit
  outl-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Shared with OutlWidget: the Quick Add control's intent runs in the app.
      - path: OutlWidget/OpenQuickAddIntent.swift
      - path: Assets.xcassets
      - path: Externals
      - path: outl-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: outl-mobile_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        # Export compliance is DELIBERATELY NOT DECLARED here. The key has
        # three states and only one of them is "I use encryption":
        #
        #   true    -> Apple has APPROVED encryption documentation for this
        #              app, and its code is in ITSEncryptionExportComplianceCode.
        #              The flag is a claim about the paperwork, not about the
        #              code, which is what made `true` the wrong answer here.
        #   false   -> the encryption is exempt.
        #   absent  -> no claim; App Store Connect asks the export questions
        #              per build.
        #
        # We shipped `true` without the code (it is issued only on approved
        # documentation, and outl has none), so every upload was refused with
        # `Invalid Export Compliance Code ... key value []` — the empty value
        # being the missing code, not the missing flag. Absent is the honest
        # state while that is true, and it costs one answer per build in App
        # Store Connect.
        #
        # To leave this state, pick one and set it in BOTH this file and
        # outl-mobile_iOS/Info.plist, since the Info.plist is committed:
        #   - exempt      -> ITSAppUsesNonExemptEncryption: false
        #   - documented  -> ITSAppUsesNonExemptEncryption: true
        #                    ITSEncryptionExportComplianceCode: <code from ASC>
        # What outl actually ships is iroh/QUIC over rustls + ring plus an
        # ed25519 device identity. Which exception that falls under is a
        # regulatory call, not a code one, which is why this file does not
        # make it.
        # Camera access string for the QR pairing scanner
        # (tauri-plugin-barcode-scanner). Required or iOS hard-crashes
        # the first time `scan()` requests the camera.
        NSCameraUsageDescription: Scan a pairing QR code to connect your devices.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        # Universal app (iPhone + iPad — TARGETED_DEVICE_FAMILY = "1,2"
        # is set in the pbxproj). Apple requires ALL four orientations
        # when iPad is declared, otherwise TestFlight upload fails with
        # a 409 "Invalid bundle … include all of the … orientations to
        # support iPad multitasking".
        # Reminder: App Store production submit still requires iPad 13"
        # and 12.9" screenshots, otherwise review will reject.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.3.1
        CFBundleVersion: "0.3.1"
    entitlements:
      path: outl-mobile_iOS/outl-mobile_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: OutlWidget
      - target: OutlShare
      - package: OutlKit
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
      - sdk: BackgroundTasks.framework
      # Required by iroh's transitive deps (system-configuration, netdev) for
      # network-interface + DNS discovery on iOS. Cargo's rustc-link-lib /
      # #[link] directives are dropped because Xcode does the final .dylib link,
      # so the frameworks must be declared here. Also mirrored in
      # tauri.conf.json → bundle.iOS.frameworks so `tauri ios init` keeps them.
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
      - sdk: CoreFoundation.framework
      # netdev >= 0.47 reads the system DNS servers through `res_9_ninit` /
      # `res_9_getservers`, behind a `#[link(name = "resolv")]` that Xcode
      # never sees either. Without it the device link fails on
      # `_res_9_getservers`. Not mirrored in tauri.conf.json, so a
      # `tauri ios init` regeneration has to put this line back by hand.
      - sdk: libresolv.tbd
    preBuildScripts:
      - script: cargo tauri ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a