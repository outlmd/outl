# monokai — Wimer Hazenberg's high-contrast palette.
#
# Hot pink accent on warm charcoal. Hex values from the canonical Monokai
# specification.
#
# Known contrast gap, exempted by name in `tests/contrast.rs`: the accent
# `#f92672` is 3.93:1 on its own canvas, over the 3.0 large-text floor and
# under AA, and three more roles reuse `accent` as a fill. Fixing it means
# picking a new Monokai accent, which is a preset decision. Its `accent_fg`
# is not exempt and does not need to be: a real field let it pick
# `#000000` and reach 5.55:1.

[dark]
bg = "#272822"
bg_elev = "#1e1f1c"
fg = "#f8f8f2"
fg_dim = "#939081"
fg_dimmer = "#75715e"
border = "#75715e"
hint = "#75715e"
accent = "#f92672"
accent_fg = "#000000"
accent_soft = "#ae81ff"
