# gruvbox — morhetz's retro-groove palette.
#
# [dark]  Warm charcoal background (`#282828`), cream text (`#ebdbb2`), and
#         the classic muted yellow / green / aqua / purple accents.
# [light] Warm cream canvas (`#fbf1c7`), dark warm-gray text (`#3c3836`),
#         with the accent and destructive hues taken from the palette's
#         normal (dark) colour set so they clear WCAG AA on cream.
#
# Hex values from the canonical gruvbox palette, both variants.
# `gruvbox-dark` still resolves — it is the derived `-dark` suffix.

[dark]
bg = "#282828"
bg_elev = "#3c3836"
fg = "#ebdbb2"
fg_dim = "#a89984"
