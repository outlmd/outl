# outl — the brand palette, matched to the marketing site (avelino.run).
#
# [dark]  Deep purple canvas, lavender accent, lemon highlight. The default
#         theme on every client.
# [light] Paper white, cool grays, one violet. Started as what outl-mobile
#         hardcoded in `styles.css` before RFC 0022 (`bg: #f6f4fb`,
#         `accent: #7c3aed`, `destructive: #e11d48`), recovered from git
#         history rather than deleted, then refreshed toward a calmer
#         single-accent canvas. Its `fg_dim` / `fg_dimmer` were alpha
#         blends (`rgba(28, 21, 48, 0.62)` / `0.42`) and are composited
#         into opaque hex here, since Palette fields have no alpha.
#
# Contrast numbers worth keeping: `accent_fg` on `accent` is 7.28:1 (dark)
# and 7.10:1 (light); `destructive_fg` on `destructive` is 7.36:1 / 4.70:1.
# The highlighter stays bright-bg/dark-fg on the light side — a real
# highlighter pen does not get darker on light paper.

[dark]
bg = "#0c0814"
bg_elev = "#15101f"
fg = "#f4f1fa"
fg_dim = "#b4adc7"
fg_dimmer = "#7b7390"
