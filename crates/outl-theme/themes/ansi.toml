code_fg = "#00aa00"
todo_open_fg = "#ffff55"
todo_done_fg = "#00aa00"
todo_done_body_fg = "#555555"
property_key_fg = "#555555"
property_value_fg = "#aaaaaa"
heading_fg = "#cccccc"
dim_fg = "#555555"
selected_bullet_bg = "#00aaaa"
