# ansi — the two generic fallbacks, built from the 16 ANSI colours.
#
# These are the only presets the TUI does NOT derive from this hex. It
# builds them from ratatui's *named* colours (`Color::Reset`, `Color::Cyan`)
# so the user's own terminal palette shows through, which is the whole
# point of having them; the hex here is what the GUI clients paint, and
# what `runtime::preset::fallback_for` lands on when the terminal does not
# advertise truecolor.
#
# Formerly `default-dark` and `light`. Both names still resolve — see
# LEGACY_NAMES in `src/registry.rs`.

[dark]
bg = "#000000"
bg_elev = "#101010"
fg = "#cccccc"
fg_dim = "#aaaaaa"
fg_dimmer = "#555555"
border = "#555555"
hint = "#aaaaaa"
accent = "#00aaaa"
accent_fg = "#000000"
accent_soft = "#55ffff"
accent_alt = "#00aa00"
warn = "#ffff55"
destructive = "#ff5555"
destructive_fg = "#000000"
ref_link_fg = "#00aaaa"
tag_link_fg = "#aa00aa"
md_link_fg = "#0066ff"
bold_fg = "#cccccc"
