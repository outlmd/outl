# nord — arctic blue-greys, low contrast.
#
# Hex values from the canonical Nord specification (nord0-nord15).
#
# Known contrast gap, exempted by name in `tests/contrast.rs`: the
# visual-mode status fill (nord15 `#b48ead`) is 4.41:1, just under AA.

